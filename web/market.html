<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>市场情绪 · 班马日记本</title>
<style>
:root{
  --bg:#f6f5f2; --card:#fffefb; --ink:#2a2622; --sub:#8a8378; --line:#eceae4;
  --up:#d13535; --down:#17803d; --accent:#e8743b; --accent-ink:#c05a28;
  --radius:18px; --shadow:0 6px 22px rgba(90,70,50,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:#e9e6df;color:var(--ink);display:flex;justify-content:center;}
#mp{width:100%;max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);
  position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;padding:0 16px calc(28px + env(safe-area-inset-bottom));}
/* 顶栏 */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#ef8b56,#e8743b);
  color:#fff;margin:0 -16px;padding:10px 16px 9px;}
header .row{display:flex;align-items:center;gap:8px;}
header .back{display:inline-flex;align-items:center;gap:2px;color:#fff;text-decoration:none;
  font-size:11px;font-weight:600;opacity:.92;padding:3px 8px 3px 3px;border-radius:14px;
  background:rgba(255,255,255,.16);}
header .back:active{background:rgba(255,255,255,.28);}
header h1{margin:0;font-size:16px;font-weight:650;}
header .asof{margin-top:2px;font-size:10.5px;opacity:.92;}
/* 综合情绪分 */
.score{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);margin-top:16px;}
.gauge{position:relative;width:96px;height:96px;flex:0 0 auto;}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg);}
.gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge .num{font-size:30px;font-weight:750;line-height:1;}
.gauge .lv{font-size:11px;font-weight:650;margin-top:3px;}
.score .txt{flex:1;}
.score .txt .t1{font-size:14px;font-weight:700;margin-bottom:4px;}
.score .txt .t2{font-size:11.5px;color:var(--sub);line-height:1.6;}
.wbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;gap:1px;}
/* Phase2 透明度诊断行 */
.diag{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);}
.diag .dg{font-size:10.5px;color:var(--sub);line-height:1.6;}
.wbar i{display:block;height:100%;}
/* 2026-11-04 审查：权重条大白话标注 + 诊断行折叠 + 周频提示 + 点选读数条 */
.wlab{font-size:9.5px;color:var(--sub);margin-top:4px;line-height:1.5;}
.fdet summary{font-size:10.5px;color:var(--sub);cursor:pointer;list-style:none;}
.fdet summary::-webkit-details-marker{display:none;}
.fdet summary::before{content:'▸ ';color:#a9a294;}
.fdet[open] summary::before{content:'▾ ';}
.fdet .dg{margin-top:4px;opacity:.9;}
.hnt{font-size:10px;font-weight:400;color:var(--sub);margin-left:6px;}
.pinstrip{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center;}
.pinstrip .pin{background:#f4f1ec;border:1px solid var(--line);border-radius:6px;
  padding:2px 7px;font-size:10px;color:var(--ink);font-weight:600;}
.pinstrip .pinclr{background:none;border:none;color:var(--sub);font-size:10.5px;cursor:pointer;
  text-decoration:underline;font-family:inherit;padding:2px 4px;}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.thint{font-size:9.5px;color:var(--sub);margin-top:3px;}
/* 标题 */
h2.sec{font-size:14px;font-weight:700;margin:20px 2px 10px;color:var(--ink);}
h2.sec .hint{font-size:11px;color:var(--sub);font-weight:500;margin-left:6px;}
/* 指标卡 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.icard{background:var(--card);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);
  cursor:pointer;transition:transform .12s;}
.icard:active{transform:scale(.98);}
.icard .lab{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px;margin-bottom:6px;}
.icard .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.icard .val{font-size:20px;font-weight:700;line-height:1.1;}
.icard .val .u{font-size:11px;font-weight:500;color:var(--sub);margin-left:2px;}
.icard .pct{font-size:10.5px;font-weight:600;margin-top:4px;}
.icard .more{font-size:10px;color:var(--accent-ink);margin-top:5px;font-weight:600;}
.icard.open{grid-column:1/-1;}
/* 详情面板 */
.detail{grid-column:1/-1;background:var(--card);border-radius:14px;box-shadow:var(--shadow);
  padding:14px;margin-top:2px;}
.detail .dt{font-size:15px;font-weight:700;margin-bottom:2px;}
.detail .dd{font-size:11.5px;color:var(--sub);line-height:1.6;margin-bottom:10px;}
.chartbox{width:100%;background:#faf8f4;border-radius:10px;padding:6px 4px 0;position:relative;}
.chartbox svg{width:100%;height:auto;display:block;}
/* 点选读数气泡 + 放大按钮（2026-11-03 发布前审查） */
.ptip{position:absolute;transform:translate(-50%,-135%);background:rgba(34,30,24,.94);color:#fff;
  font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap;
  pointer-events:none;z-index:6;box-shadow:0 2px 6px rgba(0,0,0,.18);}
.zbtn{margin-left:6px;font-size:11.5px;background:#f4f1ec;border:1px solid var(--line);border-radius:7px;
  padding:2px 8px;cursor:pointer;color:var(--sub);font-family:inherit;}
.zbtn:active{background:#ece7de;}
#cmp-chart{position:relative;}
#zoom-body{position:relative;}
#zoom .ptip{font-size:14px;padding:6px 12px;}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
.kv .k{background:#f4f1ec;border-radius:8px;padding:5px 9px;font-size:10.5px;color:var(--sub);}
.kv .k b{color:var(--ink);font-weight:700;margin-left:3px;}
.rules{font-size:11px;color:var(--sub);line-height:1.7;margin-top:6px;}
.rules b{color:var(--ink);}
.rules .hr{height:1px;background:var(--line);margin:8px 0;}
/* 对比图 */
.cmp{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-top:4px;}
.cmp .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--sub);margin:2px 0 8px;}
.cmp .legend .lg{display:flex;align-items:center;gap:5px;}
.cmp .legend .sw{width:16px;height:3px;border-radius:2px;}
.cmp .legend .swband{width:14px;height:11px;border-radius:2px;}
.cmp .note{font-size:11px;color:var(--sub);line-height:1.7;margin-top:8px;}
.cmp .note b{color:var(--ink);}
.cmp svg{width:100%;height:auto;display:block;}
/* 折叠 */
.fold{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden;}
.fold summary{cursor:pointer;padding:12px 14px;font-size:12.5px;font-weight:650;color:var(--accent-ink);
  list-style:none;display:flex;align-items:center;gap:5px;}
.fold summary::-webkit-details-marker{display:none;}
.fold summary::before{content:'▸';font-size:11px;transition:transform .15s;}
.fold[open] summary::before{transform:rotate(90deg);}
.fold-body{padding:0 14px 12px;border-top:1px solid var(--line);}
.mdesc{font-size:11px;color:var(--sub);line-height:1.75;padding:6px 0;border-bottom:1px dashed var(--line);}
.mdesc:last-child{border-bottom:none;}
.mdesc b{color:var(--ink);font-size:12px;}
/* 横屏放大浮层 */
#zoom{position:fixed;inset:0;z-index:100;background:rgba(20,18,15,.96);display:none;
  align-items:center;justify-content:center;padding:12px;}
#zoom.show{display:flex;}
#zoom .inner{width:100%;max-width:900px;}
#zoom svg{width:100%;height:auto;display:block;}
#zoom .zcap{color:#e8e3da;font-size:12px;text-align:center;margin-bottom:8px;font-weight:600;}
#zoom .zclose{position:absolute;top:12px;right:16px;color:#e8e3da;font-size:26px;cursor:pointer;}
@media (orientation:landscape){ #zoom .inner{max-width:96vw;} #zoom svg{max-height:88vh;} }
.footer{margin-top:auto;padding-top:22px;text-align:center;font-size:10px;color:#a9a294;line-height:1.6;}
.footer b{color:var(--accent-ink);font-weight:700;}
</style>
</head>
<body>
<div id="mp">
  <header>
    <div class="row">
      <a class="back" href="home.html">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span>首页</span>
      </a>
      <h1>市场情绪</h1>
    </div>
    <div class="asof" id="asof">—</div>
  </header>

  <!-- 综合情绪分 -->
  <div class="score">
    <div class="gauge" id="gauge"></div>
    <div class="txt">
      <div class="t1" id="sc-title">—</div>
      <div class="t2">把「便宜程度、杠杆热度、恐慌程度、资金面」四项合成一个 0~100 的分数：越高越热，越低越冷。</div>
      <div class="wbar" id="wbar"></div>
      <div class="wlab" id="wlab"></div>
      <div class="diag" id="diag" style="display:none"></div>
    </div>
  </div>

  <h2 class="sec">核心指标<span class="hint">点卡看走势 · 点图读年月与数值</span></h2>
  <div class="grid" id="core-grid"></div>

  <h2 class="sec">进阶 / 参考指标</h2>
  <div class="grid" id="adv-grid"></div>

  <h2 class="sec">对照回测<span class="hint">历史牛熊 vs 综合情绪分 · 点图读数</span></h2>
  <div class="cmp">
    <div class="legend">
      <span class="lg"><i class="sw" style="background:#e8743b"></i>综合情绪分</span>
      <span class="lg"><i class="sw" style="background:#8a93a3"></i>中证全指点位（右轴）</span>
      <span class="lg"><i class="swband" style="background:#d8ecd8"></i>熊市</span>
      <span class="lg"><i class="swband" style="background:#f8d5d1"></i>牛市</span>
      <button class="zbtn" id="cmp-zoom" type="button">⤢ 放大</button>
    </div>
    <div id="cmp-chart"></div>
    <div class="note" id="cmp-note"></div>
  </div>

  <details class="fold">
    <summary>指标说明：口径与参考阈值</summary>
    <div class="fold-body" id="method"></div>
  </details>

  <div class="footer">
    <div><b>＠班马成长日记</b> · 班马日记本每周日 19:00 更新</div>
    <div style="margin-top:6px">数据来自公开渠道，分位按近5年历史自算；仅为数据分析，不构成投资建议。基金有风险，投资须谨慎。</div>
  </div>
</div>

<div id="zoom" onclick="closeZoom()">
  <span class="zclose">×</span>
  <div class="inner"><div class="zcap" id="zcap"></div><div id="zoom-body"></div></div>
</div>

<script src="data.js"></script>
<script>
/* v2.1 市场情绪详情页（数据：data.js → CARD_DATA.market，8 指标） */
var M = window.CARD_DATA && window.CARD_DATA.market;
/* LV / heatColor / concl 置于顶层（2026-11-04：导出已移至 index.html 的
   market-export.js，本页不再自带导出；保持顶层对页面等效无副作用） */
var LV = {'寒冷':'#1a6fa8','偏冷':'#0b6b46','中性':'#4b5563','偏热':'#a85100','过热':'#b3261e'};
var heatColor = function(h){
  if (h==null) return '#8a93a3';
  if (h<20) return '#1a6fa8'; if (h<40) return '#0b6b46';
  if (h<55) return '#4b5563'; if (h<70) return '#a85100'; return '#b3261e';
};
function concl(k,v){
  var p=v.pct; if(p==null) return '数据暂缺';
  if(k==='erp') return p>=70?'利差阔 → 股票性价比高':(p<=30?'利差窄 → 股票性价比低':'性价比中等');
  if(k==='pe') return p>=70?'估值偏贵':(p<=30?'估值偏低':'估值适中');
  if(k==='margin') return p>=70?'杠杆情绪高涨 → 偏热':(p<=30?'杠杆情绪低迷 → 偏冷':'杠杆情绪中等');
  if(k==='m1m2') return (v.value>0?'剪刀差为正 → 信用扩张':'剪刀差为负 → 信用收缩')+(p>=60?'（偏热）':p<=40?'（偏冷）':'');
  if(k==='ivix') return p>=70?'波动高 → 市场恐慌':(p<=30?'波动低 → 市场平静':'波动中等');
  if(k==='newfund') return p>=70?'发行火爆 → 情绪顶部':(p<=20?'发行冰点 → 情绪底部':'发行正常');
  if(k==='buffett') return p>=80?'证券化率高 → 长期偏贵':(p<=40?'证券化率低 → 长期偏低':'长期适中');
  if(k==='breaknet') return v.value>=10?'破净率高 → 底部区域':(v.value<=5?'破净率低 → 顶部区域':'破净率中等');
  return '';
}
if (!M || !M.indicators){
  document.getElementById('mp').insertAdjacentHTML('beforeend',
    '<div style="padding:40px 20px;text-align:center;color:#8a8378;font-size:13px">数据未生成：请先运行 python -m fundscorer.pipeline</div>');
} else {
  /* 核心/参考分组：优先用 payload 的 core_keys（2026-11-02 核心改4核+ivix），缺失则回退硬编码 */
  var CORE = (M.core_keys && M.core_keys.length) ? M.core_keys.slice() : ['erp','margin','ivix','m1m2'];
  var ADV  = Object.keys(M.indicators).filter(function(k){ return CORE.indexOf(k) < 0; });

  document.getElementById('asof').textContent = '数据基准 ' + M.asof + ' · 8 指标 · 分位近5年';

  /* 1. 综合情绪分仪表盘 + 权重条 */
  (function(){
    var score=M.score, level=M.level, col=LV[level]||'#4b5563';
    var r=38,C=2*Math.PI*r,fill=Math.max(0,Math.min(100,score))/100*C;
    document.getElementById('gauge').innerHTML =
      '<svg viewBox="0 0 92 92">'
      +'<circle cx="46" cy="46" r="'+r+'" fill="none" stroke="#eee9e2" stroke-width="10"/>'
      +'<circle cx="46" cy="46" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round"'
      +' stroke-dasharray="'+fill.toFixed(1)+' '+C.toFixed(1)+'"/></svg>'
      +'<div class="val"><span class="num" style="color:'+col+'">'+score+'</span>'
      +'<span class="lv" style="color:'+col+'">'+level+'</span></div>';
    document.getElementById('sc-title').textContent = '当前市场情绪分 '+score+' · '+level;
    /* Phase2 透明度：有效指标/权重覆盖/离散度 + 牛熊阈值敏感 + 分级解读 */
    /* 2026-11-04 审查：诊断行原是一串术语（权重覆盖/指标分歧/多窗口…）用户看不懂 →
       折叠为「数据完整度与口径」+ 大白话；权重条补文字标注（原为无说明的裸色条） */
    var diag = document.getElementById('diag');
    if (diag){
      var bits = [];
      if (M.n_valid_core != null) bits.push('核心指标 '+M.n_valid_core+'/4 项有效');
      if (M.weight_coverage != null) bits.push('数据覆盖 '+(M.weight_coverage*100).toFixed(0)+'%');
      if (M.heat_std != null) bits.push('各指标冷热分歧 ±'+M.heat_std+'（越大说明几项指标越不一致）');
      if (M.bb_note) bits.push('牛熊划分（按回撤20%）：'+M.bb_note);
      if (M.multiwindow){
        var mw = Object.keys(M.multiwindow).map(function(k){
          var v=M.multiwindow[k];
          return v && v.score!=null ? String(k).replace('y','')+'年口径 '+v.score+'（'+(v.level||'')+'）' : null;
        }).filter(Boolean).join('、');
        if (mw) bits.push('换个时间窗看：'+mw);
      }
      diag.innerHTML = '<details class="fdet"><summary>数据完整度与口径</summary>'
        +'<div class="dg">'+bits.join('；')+'</div>'
        +(M.level_note ? '<div class="dg" style="opacity:.75">'+M.level_note+'</div>' : '')
        +'</details>';
      diag.style.display = bits.length ? 'block' : 'none';
    }
    var w=M.weights||{}, tot=0; for(var k in w) tot+=w[k];
    document.getElementById('wbar').innerHTML = CORE.map(function(k,i){
      var pct=((w[k]||0)/(tot||1))*100;
      var cols=['#e8743b','#c05a28','#a85100','#8a93a3'];
      return '<i style="width:'+pct+'%;background:'+cols[i%4]+'"></i>';
    }).join('');
    var WNAME={erp:'股债利差',margin:'两融',ivix:'波动率',m1m2:'资金面'};
    document.getElementById('wlab').textContent = '综合口径：'
      + CORE.map(function(k){ return (WNAME[k]||k)+' '+Math.round(((w[k]||0)/(tot||1))*100)+'%'; }).join(' · ');
  })();

  /* 2. 指标卡 + 点开详情 */
  /* concl 已提升至顶层（2026-11-04 导出窗口需要） */
  function lineChart(series, col, fmt, unit){
    if(!series || series.length<2) return '<div class="mdesc">历史数据不足，无法画图。</div>';
    var W=400,H=150,L=36,R=8,T=12,B=20,n=series.length;   /* L 加宽：放纵轴刻度值 */
    var vals=series.map(p=>+p[1]), mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
    var pad=(mx-mn||1)*0.1; mn-=pad; mx+=pad;
    var X=i=>L+(W-L-R)*(i/(n-1)), Y=v=>T+(H-T-B)*(1-(v-mn)/((mx-mn)||1));
    var path=series.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(+p[1]).toFixed(1)).join(' ');
    /* 纵轴：四档网格 + 数值（带单位、去 -0.0%）——2026-11-04 审查：原三档太少且
       ERP 下沿出现 -0.0%（pad 把最小值推成微负，toFixed 后成负零） */
    var ax=function(v){
      var s=fmt?fmt(v):(v.toFixed(1)+(unit||''));
      if(Math.abs(parseFloat(s))===0) s=String(s).replace('-','');
      return s;
    };
    var grid='';
    [mx, mn+(mx-mn)*2/3, mn+(mx-mn)/3, mn].forEach(function(v){
      var y=Y(v);
      grid+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="#ece6dc" stroke-width="1"/>'
        +'<text x="'+(L-4)+'" y="'+(y+3).toFixed(1)+'" font-size="9" fill="#a9a294" text-anchor="end">'+ax(v)+'</text>';
    });
    /* 横轴：年份刻度（约 6 档），解决"看不出年份" */
    var ticks='', step=Math.max(1,Math.round((n-1)/5));
    for(var i=0;i<n;i+=step){
      ticks+='<text x="'+X(i).toFixed(1)+'" y="'+(H-5)+'" font-size="8.5" fill="#a9a294" text-anchor="middle">'+String(series[i][0]).slice(0,4)+'</text>';
    }
    var svg='<svg viewBox="0 0 '+W+' '+H+'"'
      +' data-s="'+encodeURIComponent(JSON.stringify(series))+'"'
      +' data-w="'+W+'" data-h="'+H+'" data-l="'+L+'" data-r="'+R+'" data-t="'+T+'" data-b="'+B+'"'
      +' data-col="'+col+'" data-unit="'+(unit||'')+'">'
      +grid
      +'<path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="1.3"/>'
      +'<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(+vals[n-1]).toFixed(1)+'" r="3" fill="'+col+'"/>'
      +ticks
      +'</svg>';
    return svg;
  }
  function renderCard(k, v, container){
    var pct=v.pct==null?'—':v.pct.toFixed(0)+'%';
    var el=document.createElement('div');
    el.className='icard'; el.dataset.k=k;
    el.innerHTML='<div class="lab"><i class="dot" style="background:'+heatColor(v.heat)+'"></i>'+v.label+'</div>'
      +'<div class="val">'+(v.value==null?'—':v.value)+'<span class="u">'+(v.unit||'')+'</span></div>'
      +'<div class="pct" style="color:'+heatColor(v.heat)+'">热度分位 '+pct+'</div>'
      +'<div class="more">'+concl(k,v)+' ▸</div>';
    el.onclick=function(){ toggleDetail(k, v, el, container); };
    container.appendChild(el);
  }
  var CORE_KEYS=Object.keys(M.indicators);
  var cg=document.getElementById('core-grid'), ag=document.getElementById('adv-grid');
  CORE.forEach(function(k){ if(M.indicators[k]) renderCard(k, M.indicators[k], cg); });
  ADV.forEach(function(k){ if(M.indicators[k]) renderCard(k, M.indicators[k], ag); });

  var openK=null;
  function toggleDetail(k, v, cardEl, container){
    var existing=container.querySelector('.detail');
    if(openK===k){ if(existing) existing.remove(); cardEl.classList.remove('open'); openK=null; return; }
    if(existing) existing.remove();
    container.querySelectorAll('.icard').forEach(c=>c.classList.remove('open'));
    cardEl.classList.add('open'); openK=k;
    var fmt = (k==='buffett'||k==='breaknet'||k==='erp') ? function(x){return x.toFixed(1)+'%';} : null;
    var d=document.createElement('div');
    d.className='detail';
    d.innerHTML='<div class="dt">'+v.label+' 走势 <span class="hnt">周频 · 点一下读数</span> <button class="zbtn" type="button">⤢ 放大</button></div>'
      +'<div class="dd">'+v.desc+'</div>'
      +'<div class="chartbox" data-raw="'+encodeURIComponent(JSON.stringify(v.series||[]))+'"></div>'
      +'<div class="kv">'
        +'<span class="k">当前<b>'+(v.value==null?'—':v.value+(v.unit||''))+'</b></span>'
        +'<span class="k">热度分位<b>'+(v.pct==null?'—':v.pct.toFixed(0)+'%')+'</b></span>'
      +'</div>'
      +'<div class="rules"><b>怎么算：</b>'+v.how+'</div>'
      +'<div class="rules"><b>常见范围：</b>'+v.range+'</div>'
      +'<div class="rules" style="opacity:.7">数据来源：'+v.source+'</div>';
    cardEl.insertAdjacentElement('afterend', d);
    var box=d.querySelector('.chartbox');
    var series=JSON.parse(decodeURIComponent(box.dataset.raw));
    box.innerHTML=lineChart(series, heatColor(v.heat), fmt, v.unit);
    /* 点选读数（2026-11-03 发布前审查）：点/触一下显示 年月 + 数值+单位；展开即示范末点；
       放大改走右上按钮（放大后可连点多点、编号对照） */
    attachPicker(box.querySelector('svg'), box, {showLast:true});
    d.querySelector('.zbtn').onclick=function(ev){ ev.stopPropagation(); openZoom(v.label+' 走势', lineChart(series, heatColor(v.heat), fmt, v.unit)); };
    d.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  /* 3. 对照回测图（综合情绪分 + 中证全指点位 + 牛熊色带） */
  (function(){
    var bt=(M.backtest||[]).filter(b=>b.score!=null && b.pe!=null);
    if(bt.length<2){ document.getElementById('cmp-chart').innerHTML='<div class="mdesc">历史数据不足。</div>'; return; }
    var W=400,H=190,L=24,R=30,T=14,B=22,n=bt.length;   /* L=情绪轴刻度 / R=点位轴刻度 */
    var X=i=>L+(W-L-R)*(i/(n-1)), Ys=v=>T+(H-T-B)*(1-v/100);
    var pes=bt.map(b=>b.pe), pmin=Math.min.apply(null,pes), pmax=Math.max.apply(null,pes);
    var Yp=v=>T+(H-T-B)*(1-(v-pmin)/((pmax-pmin)||1));
    // 牛熊色带（按日期映射到 X）。日期两种格式并存：backtest 用 YYYY-MM、bullbear 用
    // YYYY-MM-DD——旧代码统一 +'-01' 会让 YYYY-MM-DD 变成非法日期 → NaN → 色带整段不渲染
    // （2026-11-03 发布前审查修复：说明文字写着红蓝、图里却没有任何色带）。
    var parseD=function(s){ var p=String(s).split('-'); return new Date(+p[0],(+p[1]||1)-1,p[2]?+p[2]:1).getTime(); };
    var d0=parseD(bt[0].d), d1=parseD(bt[n-1].d);
    var XD=s=>{ var t=parseD(s); return L+(W-L-R)*Math.max(0,Math.min(1,(t-d0)/((d1-d0)||1))); };
    var bands='';
    (M.bullbear||[]).forEach(function(b){
      var x0=XD(b.start), x1=XD(b.end);
      var fill=b.type==='bear'?'#d8ecd8':'#f8d5d1';   /* 2026-11-04 用户定：牛市=红、熊市=绿（红涨绿跌习惯） */
      bands+='<rect x="'+x0.toFixed(1)+'" y="'+T+'" width="'+Math.max(1,(x1-x0)).toFixed(1)+'" height="'+(H-T-B)+'" fill="'+fill+'" opacity=".7"/>';
    });
    var pathS=bt.map((b,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Ys(b.score).toFixed(1)).join(' ');
    var pathP=bt.map((b,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Yp(b.pe).toFixed(1)).join(' ');
    /* 情绪轴网格（0/50/100）+ 年份刻度：与指标走势同款可读性（2026-11-03 审查） */
    var grid='';
    [100,50,0].forEach(function(v){ var y=Ys(v);
      grid+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="#ece6dc" stroke-width="1"/>'
        +'<text x="'+(L-3)+'" y="'+(y+3).toFixed(1)+'" font-size="8" fill="#a9a294" text-anchor="end">'+v+'</text>'; });
    var ticks='', step=Math.max(1,Math.round((n-1)/5));
    for(var i=0;i<n;i+=step){
      ticks+='<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" font-size="8.5" fill="#a9a294" text-anchor="middle">'+String(bt[i].d).slice(0,4)+'</text>';
    }
    var svg='<svg viewBox="0 0 '+W+' '+H+'"'
      +' data-s="'+encodeURIComponent(JSON.stringify(bt.map(function(b){return [b.d,b.score];})))+'"'
      +' data-s2="'+encodeURIComponent(JSON.stringify(bt.map(function(b){return [b.d,b.pe];})))+'"'
      +' data-mode="cmp" data-w="'+W+'" data-h="'+H+'" data-l="'+L+'" data-r="'+R+'" data-t="'+T+'" data-b="'+B+'"'
      +' data-col="#e8743b">'+bands+grid
      +'<path d="'+pathP+'" fill="none" stroke="#8a93a3" stroke-width="1.1" opacity=".8"/>'
      +'<path d="'+pathS+'" fill="none" stroke="#e8743b" stroke-width="1.6"/>'
      +ticks
      /* 右轴（点位）两个刻度 + 曲线末端标注（2026-11-04 采纳：防把点位线读成情绪分） */
      +'<text x="'+(W-R+4)+'" y="'+(T+8)+'" font-size="8" fill="#8a93a3">'+Math.round(pmax)+'</text>'
      +'<text x="'+(W-R+4)+'" y="'+(H-B-1)+'" font-size="8" fill="#8a93a3">'+Math.round(pmin)+'</text>'
      +'<text x="'+(X(n-1)-3).toFixed(1)+'" y="'+(Ys(bt[n-1].score)-5).toFixed(1)+'" font-size="8" fill="#e8743b" text-anchor="end">情绪分</text>'
      +'<text x="'+(X(n-1)-3).toFixed(1)+'" y="'+(Yp(bt[n-1].pe)-5).toFixed(1)+'" font-size="8" fill="#8a93a3" text-anchor="end">点位</text>'
      +'</svg>';
    var box=document.getElementById('cmp-chart');
    box.innerHTML=svg;
    attachPicker(box.querySelector('svg'), box);   /* 点选读数：年月·情绪·点位 */
    document.getElementById('cmp-zoom').onclick=function(){ openZoom('历史牛熊 vs 综合情绪分', box.innerHTML); };
    var bb=(M.bullbear||[]);
    var nb=bb.filter(b=>b.type==='bear').length, nu=bb.length-nb;
    document.getElementById('cmp-note').innerHTML=
      '回测 '+bt.length+' 个月（'+bt[0].d+' ~ '+bt[n-1].d+'），自动识别 <b>'+nb+' 段熊市 / '+nu+' 段牛市</b>（20% 定义）：'
      +'浅红为牛市区间、浅绿为熊市区间（点图可读数）。综合情绪分≥70 多对应点位阶段性高位，≤30 接近底部区域。仅作历史规律示意，不构成预测。';
  })();

  /* 4. 指标说明（全部8项，含 caveat 口径局限）+ 回测分档统计（D2） */
  var METH={};
  var ALLK = Object.keys(M.indicators);
  ALLK.forEach(function(k){ var v=M.indicators[k]; if(v) METH[k]=[v.label, v.how, v.range, v.source, v.caveat, CORE.indexOf(k)>=0]; });
  var html = ALLK.map(function(k){
    var d=METH[k]; if(!d) return '';
    var coreTag = d[5] ? '<span style="color:#e8743b;font-weight:700">[核心]</span> ' : '<span style="opacity:.6">[参考]</span> ';
    return '<div class="mdesc">'+coreTag+'<b>'+d[0]+'</b><br>'+d[1]+'<br><b>范围：</b>'+d[2]+'<br>'
      + '<span style="opacity:.7">来源：'+d[3]+'</span>'
      + (d[4] ? '<br><b style="color:#a85100">口径局限：</b><span style="color:#a85100">'+d[4]+'</span>' : '')
      + '</div>';
  }).join('');
  /* D2 回测分档统计表 */
  if (M.band_stats && M.band_stats.length){
    html += '<div class="mdesc"><b>回测：各情绪档未来收益（中证全指）</b><br>'
      + '<span style="opacity:.75">样本为历史月度，前瞻收益=该档后N月中证全指涨跌幅中位数，胜率为正收益占比。</span><br>'
      + '<div class="tscroll"><table style="width:100%;border-collapse:collapse;font-size:10.5px;margin-top:5px">'
      + '<tr style="border-bottom:1px solid #ccc"><td style="padding:3px">档位</td><td>n</td><td>3月</td><td>3月胜率</td><td>6月</td><td>6月胜率</td><td>12月</td><td>12月胜率</td></tr>'
      + M.band_stats.map(function(b){
        var f=function(v,s){return v==null?'—':(s||'')+v.toFixed(1)+(s?'%':'')};
        var w=function(v){return v==null?'—':v.toFixed(0)+'%'};
        return '<tr style="border-bottom:1px solid #eee"><td style="padding:3px">'+b.band+'</td><td>'+b.n+'</td>'
          +'<td>'+f(b.r3_med,'+')+'</td><td>'+w(b.r3_wr)+'</td>'
          +'<td>'+f(b.r6_med,'+')+'</td><td>'+w(b.r6_wr)+'</td>'
          +'<td>'+f(b.r12_med,'+')+'</td><td>'+w(b.r12_wr)+'</td></tr>';
      }).join('')
      + '</table></div><div class="thint">← 左右滑动看全部列</div>'
      + (M.level_note ? '<br><span style="color:#a85100">'+M.level_note+'</span>' : '')
      + '</div>';
  }
  /* Phase4 已知缺口与决策（诚实标注） */
  if (M.gaps_note){
    html += '<div class="mdesc"><b>已知缺口与取舍</b><br><span style="color:#a85100">'+M.gaps_note+'</span></div>';
  }
  document.getElementById('method').innerHTML = html;
}

/* 点选读数（2026-11-03 审查；2026-11-04 升级：放大浮层可连点多点、编号对照）：
   点/触走势图任意处 → 显示 年月 + 纵轴数值；multi 模式每点一次钉住一个编号标记，
   图下方出编号清单（可重点取消/清空）。序列经 svg 的 data-s（/data-s2）携带，
   内联小图与放大浮层共用同一实现。 */
function attachPicker(svg, box, opts){
  opts = opts || {};
  if(!svg || !box || svg.dataset.wired || !svg.getAttribute('data-s')) return;
  svg.dataset.wired='1';
  var multi = !!opts.multi;
  var num=function(k,d){ var v=svg.getAttribute('data-'+k); return v==null?d:+v; };
  var W=num('w',400),H=num('h',150),L=num('l',6),R=num('r',6),T=num('t',12),B=num('b',20);
  var series=JSON.parse(decodeURIComponent(svg.getAttribute('data-s')));
  var s2a=svg.getAttribute('data-s2');
  var s2=s2a?JSON.parse(decodeURIComponent(s2a)):null;
  var mode=svg.getAttribute('data-mode')||'';
  var col=svg.getAttribute('data-col')||'#e8743b';
  var unit=svg.getAttribute('data-unit')||'';
  if(!series||series.length<2) return;
  var vals=series.map(function(p){return +p[1];});
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mode==='cmp'){ mn=0; mx=100; }                 /* 对照图情绪轴固定 0-100 */
  var pad=(mx-mn||1)*0.1; mn-=pad; mx+=pad;
  var X=function(i){return L+(W-L-R)*(i/(series.length-1));};
  var Y=function(v){return T+(H-T-B)*(1-(v-mn)/((mx-mn)||1));};
  var NS='http://www.w3.org/2000/svg';
  var guide=document.createElementNS(NS,'line');
  guide.setAttribute('stroke','#b9b1a3'); guide.setAttribute('stroke-dasharray','3 3');
  guide.setAttribute('stroke-width','1'); guide.setAttribute('visibility','hidden');
  svg.appendChild(guide);
  var dot=document.createElementNS(NS,'circle');
  dot.setAttribute('r','4.5'); dot.setAttribute('stroke','#fff'); dot.setAttribute('stroke-width','1.5');
  dot.setAttribute('visibility','hidden'); svg.appendChild(dot);
  var tip=document.createElement('div'); tip.className='ptip'; tip.style.display='none';
  box.appendChild(tip);
  var pins=[], pg=document.createElementNS(NS,'g'); svg.appendChild(pg);
  var strip=null;
  svg.style.cursor='pointer';
  if(multi){ strip=document.createElement('div'); strip.className='pinstrip'; strip.style.display='none'; box.appendChild(strip); }
  function tipText(i){
    if(mode==='cmp'){
      var pe=s2?+s2[i][1]:null;
      return series[i][0]+' · 情绪分 '+Math.round(vals[i])+(pe==null?'':' · 点位 '+Math.round(pe));
    }
    var v=vals[i];
    var body=Math.abs(v)>=100?v.toFixed(0)
      :(v!==0&&Math.abs(v)<0.01?v.toFixed(4)   /* 两融早期只有万分之几万亿，toFixed(2) 会抹成 0.00 */
        :v.toFixed(2));
    return series[i][0]+' · '+body+unit;
  }
  function renderPins(){
    while(pg.firstChild) pg.removeChild(pg.firstChild);
    if(!strip) return;
    if(!pins.length){ strip.style.display='none'; strip.innerHTML=''; return; }
    strip.style.display='flex';
    strip.innerHTML=pins.map(function(i,k){ return '<span class="pin">'+(k+1)+' '+tipText(i)+'</span>'; }).join('')
      +'<button class="pinclr" type="button">清空</button>';
    strip.querySelector('.pinclr').onclick=function(ev){ ev.stopPropagation(); pins=[]; renderPins(); hideTip(); };
    pins.forEach(function(i,k){
      var c=document.createElementNS(NS,'circle');
      c.setAttribute('cx',X(i).toFixed(1)); c.setAttribute('cy',Y(vals[i]).toFixed(1));
      c.setAttribute('r','6.5'); c.setAttribute('fill',col);
      c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','1.5');
      pg.appendChild(c);
      var t=document.createElementNS(NS,'text');
      t.setAttribute('x',X(i).toFixed(1)); t.setAttribute('y',(Y(vals[i])+2.8).toFixed(1));
      t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','8');
      t.setAttribute('font-weight','700'); t.setAttribute('fill','#fff');
      t.textContent=String(k+1); pg.appendChild(t);
    });
  }
  function hideTip(){ tip.style.display='none'; guide.setAttribute('visibility','hidden'); dot.setAttribute('visibility','hidden'); }
  function show(i, pin){
    var px=X(i), py=Y(vals[i]);
    guide.setAttribute('x1',px.toFixed(1)); guide.setAttribute('x2',px.toFixed(1));
    guide.setAttribute('y1',T); guide.setAttribute('y2',H-B);
    guide.setAttribute('visibility','visible');
    dot.setAttribute('cx',px.toFixed(1)); dot.setAttribute('cy',py.toFixed(1));
    dot.setAttribute('fill',col); dot.setAttribute('visibility','visible');
    tip.textContent=tipText(i); tip.style.display='block';
    tip.style.left=(px/((svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.width)||W)*100)+'%';
    tip.style.top=(py/H*100)+'%';
    if(multi && pin){
      var at=pins.indexOf(i);
      if(at>=0){ pins.splice(at,1); } else { if(pins.length>=8) pins.shift(); pins.push(i); }
      renderPins();
    }
  }
  svg.onclick=function(ev){
    var r=svg.getBoundingClientRect();
    var vbW=(svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.width)||W;
    var x=(ev.clientX-r.left)/Math.max(1,r.width)*vbW;
    /* 取点反演：i = (x-L)/(W-L-R)*(n-1)。2026-11-04 修复：曾把 (n-1) 误写进分母，
       导致点哪里都算出 index 0（用户反馈"点曲线没反应，只有首末点"） */
    var i=Math.round((x-L)/(W-L-R)*(series.length-1));
    i=Math.max(0,Math.min(series.length-1,i));
    show(i, multi);
    if(ev.stopPropagation) ev.stopPropagation();
  };
  if(opts.showLast) show(series.length-1, false);   /* 详情展开即示范读数 */
}
/* 缩放浮层 */
function openZoom(cap, svg){
  document.getElementById('zcap').textContent=cap;
  var body=document.getElementById('zoom-body');
  /* 剥掉 data-wired：box.innerHTML 带回已接线标记会让 attachPicker 直接 return（放大后读不到数） */
  body.innerHTML=String(svg).replace(' data-wired="1"','');
  document.getElementById('zoom').classList.add('show');
  var s=body.querySelector('svg');
  if(s) attachPicker(s, body, {multi:true});   /* 放大后可连点多点、编号对照 */
}
function closeZoom(){ document.getElementById('zoom').classList.remove('show'); }
</script>
</body>
</html>
