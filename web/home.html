<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>班马日记本</title>
<style>
:root{
  --bg:#f6f5f2;            /* 柔和暖底（App 风，低饱和） */
  --card:#fffefb;
  --ink:#2a2622;
  --sub:#8a8378;
  --line:#eceae4;
  --accent:#e8743b;        /* 柔化橙（比 #ff6a00 低饱和，App 质感） */
  --accent-ink:#c05a28;
  --radius:20px;
  --shadow:0 6px 22px rgba(90,70,50,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:#e9e6df;}
#home{width:100%;max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);
  position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;padding:0 20px calc(28px + env(safe-area-inset-bottom));}

/* ---- 顶部 ---- */
.hd{padding:34px 4px 8px;}
.hd .hi{font-size:14px;color:var(--sub);letter-spacing:.3px;}
.hd h1{margin:6px 0 0;font-size:30px;font-weight:750;color:var(--ink);letter-spacing:.5px;}
.hd .sub{margin-top:8px;font-size:12.5px;color:var(--sub);line-height:1.6;}
.hd .brand{display:inline-flex;align-items:center;gap:6px;margin-top:14px;
  background:rgba(232,116,59,.10);color:var(--accent-ink);border-radius:20px;
  padding:5px 12px;font-size:11.5px;font-weight:600;}
.hd .brand b{font-weight:750;}

/* ---- 卡片栅格 ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;}
.card{position:relative;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);
  padding:18px 16px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;
  cursor:pointer;border:1px solid rgba(0,0,0,.02);transition:transform .15s ease, box-shadow .15s ease;
  text-decoration:none;color:inherit;overflow:hidden;}
.card:active{transform:scale(.975);box-shadow:0 3px 12px rgba(90,70,50,.10);}
.card.wide{grid-column:1 / -1;min-height:120px;flex-direction:row;align-items:center;gap:16px;}
.card .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:23px;margin-bottom:auto;}
.card .nm{font-size:17px;font-weight:700;color:var(--ink);margin-top:14px;line-height:1.3;}
.card .ds{font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.5;}
.card.wide .txt{flex:1;}
.card.wide .nm{margin-top:0;}
.card .arrow{position:absolute;right:16px;bottom:16px;color:var(--sub);opacity:.5;font-size:15px;}

/* 各卡主题色（柔和） */
.c-bond .ic{background:rgba(70,130,180,.12);}
.c-index .ic{background:rgba(232,116,59,.13);}
.c-div .ic{background:rgba(190,90,110,.12);}
.c-eq .ic{background:rgba(120,110,180,.12);}
.c-mkt .ic{background:rgba(70,140,130,.13);}
/* 市场情绪卡：右上角迷你情绪分预览 */
.mkt-mini{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;
  align-items:flex-end;line-height:1;}
.mkt-mini .t{font-size:22px;font-weight:750;}
.mkt-mini .l{font-size:10px;font-weight:600;margin-top:1px;}

/* 开发中卡 */
.card.dev{cursor:default;opacity:.72;}
.card.dev:active{transform:none;box-shadow:var(--shadow);}
.card.dev .badge{position:absolute;top:14px;right:14px;background:#f0eee8;color:var(--sub);
  border-radius:14px;padding:3px 9px;font-size:10.5px;font-weight:600;}
.card.soon .nm{color:var(--sub);}
/* v1.8 活跃卡「测试中」徽标（指数温度计；用户 2026-10-31）：柔橙描边、不影响点击 */
.card .badge.testing{position:absolute;top:14px;right:14px;background:rgba(232,116,59,.12);
  color:var(--accent-ink);border:1px solid rgba(232,116,59,.30);border-radius:14px;
  padding:2px 9px;font-size:10.5px;font-weight:700;}

/* ---- 底部 ---- */
.ft{margin-top:auto;padding-top:24px;text-align:center;}
.ft .acc{font-size:11.5px;color:var(--sub);}
.ft .acc b{color:var(--accent-ink);font-weight:700;}

/* ---- 市场情绪块（v2.0，用户 2026-11-01） ---- */
.mkt{margin-top:26px;}
.mkt-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
.mkt-hd h2{margin:0;font-size:17px;font-weight:700;color:var(--ink);}
.mkt-hd .asof{font-size:10.5px;color:var(--sub);}
.mkt-score{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px;}
.mkt-gauge{position:relative;width:88px;height:88px;flex:0 0 auto;}
.mkt-gauge svg{width:100%;height:100%;transform:rotate(-90deg);}
.mkt-gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;}
.mkt-gauge .num{font-size:26px;font-weight:750;line-height:1;}
.mkt-gauge .lv{font-size:10.5px;font-weight:600;margin-top:2px;}
.mkt-score .txt{flex:1;}
.mkt-score .txt .t1{font-size:13px;font-weight:650;color:var(--ink);margin-bottom:3px;}
.mkt-score .txt .t2{font-size:11px;color:var(--sub);line-height:1.5;}
.mkt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.mkt-card{background:var(--card);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow);}
.mkt-card .lab{font-size:10.5px;color:var(--sub);margin-bottom:5px;display:flex;
  align-items:center;gap:4px;}
.mkt-card .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.mkt-card .val{font-size:19px;font-weight:700;color:var(--ink);line-height:1.1;}
.mkt-card .val .u{font-size:11px;font-weight:500;color:var(--sub);margin-left:2px;}
.mkt-card .sub{font-size:10.5px;color:var(--sub);margin-top:4px;line-height:1.4;}
.mkt-card .pct{font-size:10.5px;font-weight:600;margin-top:3px;}
/* 折叠区 */
.mkt-fold{background:var(--card);border-radius:14px;box-shadow:var(--shadow);
  margin-bottom:12px;overflow:hidden;}
.mkt-fold summary{cursor:pointer;padding:11px 14px;font-size:12.5px;font-weight:650;
  color:var(--accent-ink);list-style:none;display:flex;align-items:center;gap:5px;}
.mkt-fold summary::-webkit-details-marker{display:none;}
.mkt-fold summary::before{content:'▸';font-size:11px;transition:transform .15s;}
.mkt-fold[open] summary::before{transform:rotate(90deg);}
.mkt-fold-body{padding:0 14px 12px;border-top:1px solid var(--line);}
.mkt-chart{width:100%;height:auto;display:block;margin-top:8px;}
.mkt-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--sub);margin-top:4px;}
.mkt-legend .lg{display:flex;align-items:center;gap:4px;}
.mkt-legend .sw{width:14px;height:3px;border-radius:2px;}
.mkt-desc{font-size:11px;color:var(--sub);line-height:1.7;padding:2px 0;}
.mkt-desc b{color:var(--ink);}
.ft .disc{margin-top:8px;font-size:10px;color:#a9a294;line-height:1.6;padding:0 6px;}
</style>
</head>
<body>
<div id="home">
  <div class="hd">
    <div class="hi">你好，欢迎回来</div>
    <h1>班马日记本</h1>
    <div class="sub">用心动值，帮你把基金池里的机会<br>按温度排好序。每周更新。</div>
    <div class="brand"><b>＠班马成长日记</b> · 每周更新</div>
  </div>

  <div class="grid">
    <!-- 偏债心动榜单 -->
    <a class="card c-bond" href="index.html?section=bond">
      <div class="ic">❤️</div>
      <div class="nm">偏债心动榜单</div>
      <div class="ds">每周更新四类偏债心动榜</div>
      <span class="arrow">›</span>
    </a>

    <!-- 指数温度计 -->
    <a class="card c-index" href="index.html?section=index">
      <div class="ic">🌡️</div>
      <div class="nm">指数温度计</div>
      <div class="ds">全市场指数估值温度，冷热一目了然</div>
      <span class="arrow">›</span>
    </a>

    <!-- 市场情绪（v2.1，与偏债/指数同级卡片 → market.html） -->
    <a class="card c-mkt" href="market.html" id="mkt-card">
      <div class="ic">📊</div>
      <div class="nm">市场情绪</div>
      <div class="ds" id="mkt-card-ds">股债性价比、估值、情绪、周期多维情绪分</div>
      <div class="mkt-mini" id="mkt-mini" hidden></div>
      <span class="arrow">›</span>
    </a>

    <!-- 红利天气（2026-11-06 上线 → weather.html 卡片墙，点卡片进详情） -->
    <a class="card c-div" href="weather.html" id="div-card">
      <div class="ic">🌤️</div>
      <div class="nm">红利天气</div>
      <div class="ds" id="div-card-ds">红利指数股息率天气，晴雨一目了然</div>
      <span class="arrow">›</span>
    </a>

    <!-- 偏股（留位，暂不命名） -->
    <div class="card c-eq dev soon">
      <span class="badge">敬请期待</span>
      <div class="ic">📈</div>
      <div class="nm">偏股主动</div>
      <div class="ds">主动基金心动榜，开发中</div>
    </div>
  </div>

  <div class="ft">
    <div class="acc"><b>＠班马成长日记</b> · 班马日记本每周更新</div>
    <div class="disc">本页数据由程序基于公开历史数据自动生成，仅为数据分析研究结论，不构成任何投资建议或基金推介；心动值为池内相对评分，靠前不预示后续表现一定更好。基金有风险，投资须谨慎。</div>
  </div>
</div>

<script src="data.js"></script>
<script>
/* v2.1 主界面市场情绪卡：只填预览（情绪分+等级），详情在 market.html */
(function(){
  var M = window.CARD_DATA && window.CARD_DATA.market;
  var card = document.getElementById('mkt-card');
  if (!M || !M.indicators || M.score == null){ if(card) card.removeAttribute('href'); return; }
  var LV_COLOR = {'寒冷':'#1a6fa8','偏冷':'#0b6b46','中性':'#4b5563','偏热':'#a85100','过热':'#b3261e'};
  var col = LV_COLOR[M.level] || '#4b5563';
  var mini = document.getElementById('mkt-mini');
  mini.hidden = false;
  mini.innerHTML = '<span class="t" style="color:'+col+'">'+M.score+'</span>'
    + '<span class="l" style="color:'+col+'">'+M.level+'</span>';
  document.getElementById('mkt-card-ds').textContent = '市场情绪分 '+M.score+' · '+M.level+'，8 指标多维观察';
})();
/* 红利天气卡预览（2026-11-06）：显示最晴的一只 + 晴天系数量 */
(function(){
  var D = window.CARD_DATA || {};
  var wx = (((D.eq_index || {}).indices) || []).filter(function(x){ return x.module === 'weather'; });
  var el = document.getElementById('div-card-ds');
  if (!el || !wx.length) return;
  var top = wx.slice().sort(function(a,b){ return (b.dyr||0) - (a.dyr||0); })[0];
  var sun = wx.filter(function(x){ return x.weather==='酷暑' || x.weather==='晴天'; }).length;
  el.textContent = '最晴：' + top.name + ' ' + top.weather + ' · 晴天系 ' + sun + ' 只';
})();
</script>
</body>
</html>
