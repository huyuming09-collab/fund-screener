<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班马日记本</title>
<style>
:root{
  /* v1.7 配色全面统一主界面 home.html（柔和 App 风，用户 2026-10-31 拍板）：
     冷灰底→暖米底、高饱和橙→柔橙、纯白卡→暖白卡、圆角加大 */
  --bg:#f6f5f2; --card:#fffefb; --ink:#2a2622; --sub:#8a8378; --line:#eceae4;
  --up:#d13535;      /* 涨/收益红（白底 4.9:1，2026-10-22 加深，金融语义保留） */
  --down:#17803d;    /* 跌/回撤绿（白底 5.0:1，2026-10-22 加深，金融语义保留） */
  --accent:#e8743b;  /* 主色·柔橙（App 风，低饱和；填充/渐变） */
  --accent-ink:#c05a28; /* 强调橙·文字用（暖白卡上对比度足够） */
  --gold:#ffb400;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#e9e6df;height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
     color:var(--ink);display:flex;justify-content:center;}
/* 手机框：视口等高，列表与详情各自内部滚动（修复详情页无法上下滑动：此前 #detail 被
   撑高到整个榜单高度、overflow 永不触发，同时 body 被锁 → 卡死） */
/* 内容列：手机满宽；电脑（≥640px）居中限宽 480px + 投影（窄栏居中单列，用户确认口径） */
#phone{width:100%;max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);position:relative;overflow:hidden;
       display:flex;flex-direction:column;}
/* v1.5 移动端统一（用户 2026-10-31）：不再适配电脑端宽版布局——桌面也按手机宽度居中显示，
   删除原 ≥640px 阴影 / ≥1024px 双列宽版 media query */
#phone>header{flex:0 0 auto;}

/* ---------- 顶部（v1.7 柔橙，与主界面 home 统一；降低视觉冲击） ---------- */
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#ef8b56,#e8743b);
       color:#fff;padding:7px 12px 6px;}
/* v1.7 顶栏加返回主界面按钮（hub-and-spoke 回路，用户 2026-10-31） */
header .hdr-top{display:flex;align-items:center;gap:8px;}
header .back-home{display:inline-flex;align-items:center;gap:2px;color:#fff;text-decoration:none;
  font-size:11px;font-weight:600;opacity:.92;padding:3px 8px 3px 3px;border-radius:14px;
  background:rgba(255,255,255,.16);flex:0 0 auto;}
header .back-home:active{background:rgba(255,255,255,.28);}
header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.5px;}
header .meta{font-size:10.5px;opacity:1;font-weight:500;margin-top:2px;text-shadow:0 1px 2px rgba(90,35,0,.30);}
header .meta b.asof{font-size:11.5px;letter-spacing:.2px;text-shadow:0 0 8px rgba(255,209,102,.35);}
/* v1.4 下滚收起 meta（问题6：把高度还给数据区） */
header .meta{transition:max-height .18s,opacity .15s,margin .18s;max-height:32px;overflow:hidden;}
header.compact .meta{max-height:0;opacity:0;margin-top:0;}
/* v1.8 页签下移白区（用户 2026-10-31）：顶栏只留标题+数据基准，页签在白色区域顶部。
   白底胶囊：激活=柔橙填充，非激活=暖灰底。指数区只有1页签→不渲染 tabbar，白区铺满。 */
.tabbar{flex:0 0 auto;background:var(--card);padding:9px 12px 4px;
  border-bottom:1px solid var(--line);}
.tabbar:empty{display:none;}
.tab{flex:0 0 auto;min-height:34px;display:inline-flex;align-items:center;padding:7px 14px;
     border-radius:11px;font-size:13px;background:#f2efe9;color:var(--sub);white-space:nowrap;
     border:none;font-weight:600;}
.tab.active{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(232,116,59,.28);}
.tab.disabled{opacity:.45;}
.tab .soon{font-size:10px;margin-left:3px;}
.nav-tabs{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}

/* ---------- 榜单卡 ---------- */
main{padding:12px 12px 30px;flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.fundcard{background:var(--card);border-radius:var(--radius);padding:13px 14px 11px;margin-bottom:11px;
          box-shadow:0 1px 4px rgba(20,24,40,.05);cursor:pointer;transition:transform .08s;}
.fundcard:active{transform:scale(.985);}
.fundcard:hover{box-shadow:0 4px 14px rgba(20,24,40,.10);}
.fc-head{display:flex;align-items:center;gap:9px;}
.rank{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:#fff2ea;color:var(--accent-ink);
      font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.rank.top1{background:#fff0f0;color:#cf3232;} .rank.top2{background:#fff6e8;color:#a85c00;}
.rank.top3{background:#fff9e0;color:#8a6200;}
.fc-name{font-size:15.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
         white-space:nowrap;}
.fc-code{font-size:11.5px;color:var(--sub);margin-top:2px;display:flex;gap:6px;align-items:center;}
.fc-code .score{color:var(--accent-ink);font-weight:600;}
.fc-code .dot{color:#d8dbe0;}
.fc-metrics{display:grid;grid-template-columns:repeat(4,1fr);margin-top:11px;
            background:#fafbfc;border-radius:10px;padding:8px 2px;}
.m{ text-align:center;position:relative;}
.m+.m:before{content:"";position:absolute;left:0;top:14%;height:72%;width:1px;background:var(--line);}
.m .v{font-size:14px;font-weight:650;letter-spacing:-.2px;}
.m .l{font-size:10.5px;color:var(--sub);margin-top:3px;}
.pos{color:var(--up);} .neg{color:var(--down);}
.fc-foot{display:flex;gap:10px;margin-top:9px;font-size:11.5px;color:var(--sub);
         align-items:center;flex-wrap:wrap;row-gap:3px;}
.fc-foot .fee{color:var(--sub);}
/* 环比：升红/降绿/平灰（涨红跌绿约定）；新增橙标 */
.rk{font-weight:600;margin-left:4px;}
.rk.up{color:var(--up);} .rk.dn{color:var(--down);} .rk.flat{color:var(--sub);}
.rk.new{color:#a85100;background:#fff4ec;border-radius:5px;padding:0 5px;
        font-size:10.5px;margin-left:5px;}
/* 指数基金徽标：与主动基金区分（评估口径不同——看跟踪标的/业绩/费率，不看经理） */
.rk.idx{color:#2456b8;background:#e6eefc;border-radius:5px;padding:0 5px;
        font-size:10.5px;margin-left:5px;font-weight:600;}
/* v5.5 风格标签（池内相对：vs 候选中位切四象限）与经理占席（全榜统计）——均仅展示不计分 */
.rk.style{border-radius:8px;padding:1px 6px;font-size:10.5px;margin-left:5px;font-weight:600;}
.rk.style.aggr{background:#fff1e6;color:#a85100;}      /* 进取型：收益波动双高 */
.rk.style.steady{background:#e8f6ec;color:#1a7f37;}    /* 稳健型：收益高波动低 */
.rk.style.defen{background:#e8f1fd;color:#1d5bb8;}     /* 防守型：收益波动双低 */
.rk.sgz{color:#c0392b;background:#fdecea;border-radius:5px;padding:0 5px;
  border:1px solid rgba(192,57,43,.35);font-size:10.5px;}   /* 暂停申购标注（2026-10-20） */
.d-code-inline{opacity:.55;font-size:12px;margin-left:8px;font-weight:600;letter-spacing:.5px;}
#d-score{white-space:nowrap;}
.rk.style.wave{background:#f3ecfd;color:#7237c0;}      /* 震荡型：收益低波动高 */
.seats{color:#a15c00;background:#fff7e0;border-radius:8px;padding:1px 6px;
       font-size:10.5px;font-weight:600;}
/* 债指分组头（2026-10-22 重做：原浅底白字对比度 1.07 不可读 → 蓝底深字 9.2:1） */
.idx-group{grid-column:1/-1;display:flex;   /* 桌面 2 列网格下跨双列（2026-10-22）*/justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;row-gap:4px;
           padding:9px 13px;margin:16px 0 8px;border-radius:12px;background:#eef3fd;border-left:4px solid #3b6fd4;
           color:#1d3f7a;font-size:13.5px;font-weight:700;}
.idx-group .sub{font-weight:400;font-size:11px;color:#4a6fae;}
.idx-foot{flex:1 1 100%;order:9;font-size:10.5px;line-height:1.5;color:#5273b8;}
.fundcard.is-index{box-shadow:inset 3px 0 0 #3b6fd4,0 1px 4px rgba(20,24,40,.05);}
/* ---------- 指数估值（v5.22，债指之外的指数型基金） ---------- */
.eqcard{box-shadow:inset 3px 0 0 #0b6b46,0 1px 4px rgba(20,24,40,.05);cursor:pointer;}
.tier{flex:0 0 auto;min-width:60px;text-align:center;border-radius:9px;padding:5px 7px;
      font-size:12.5px;font-weight:700;line-height:1.25;}
.tier.t1{background:#dff0fb;color:#1a6fa8;}   /* 极低估·冰封（最冷·蓝） */
.tier.t2{background:#e3f5ec;color:#0b6b46;}   /* 低估·微凉（冷·绿） */
.tier.t3{background:#e9f6ee;color:#1a7f37;}   /* 合理偏低·清爽（凉·浅绿） */
.tier.t4{background:#eef0f3;color:#4b5563;}   /* 正常·常温（中性·灰） */
.tier.t5{background:#fff3e3;color:#a85100;}   /* 合理偏高·微暖（暖·橙） */
.tier.t6{background:#fdecea;color:#b3261e;}   /* 高估·燥热（热·红） */
.tier.big{display:inline-block;font-size:24px;padding:10px 18px;border-radius:13px;margin:2px 0 8px;}
.eq-pct{text-align:right;flex:0 0 auto;}
.eq-pct b{display:block;font-size:18px;color:var(--accent-ink);line-height:1.1;}
.eq-pct span{font-size:10.5px;color:var(--sub);}
.pctbands{position:relative;display:flex;height:9px;border-radius:5px;overflow:hidden;
          margin:8px 0 2px;background:#f2f4f7;}
.pctbands span{display:block;height:100%;opacity:.55;}
.pctbands i.m{position:absolute;top:-4px;width:3px;height:17px;background:#1c1e22;
              border-radius:2px;box-shadow:0 0 0 1px #fff;}
.eq-line{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:6px;}
.eq-warn{background:#fff7e0;border-left:3px solid #e8a33d;border-radius:8px;
         padding:7px 10px;margin-top:8px;font-size:11.5px;color:#7a4d00;line-height:1.6;}
.eqf{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;padding:9px 0;
     border-bottom:1px solid var(--line);}
.eqf:last-child{border-bottom:none;}
.eqf-l{flex:1 1 60%;min-width:0;}
.eqf-l b{display:block;font-size:13px;font-weight:650;line-height:1.4;word-break:break-all;}
.eqf-l span{font-size:10.5px;color:var(--sub);}
.eqf-r{flex:0 0 auto;text-align:right;}
.eqf-r b{display:block;font-size:14px;color:var(--accent-ink);}
.eqf-r span{font-size:10px;color:var(--sub);}
.eqf-sub{flex:1 1 100%;font-size:10.5px;color:var(--sub);line-height:1.5;}
.eqf.susp .eqf-l b{color:#b3261e;}
/* v3 主流指数表 + 参考图 */
.eq-filter{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px;}
.eq-filter button{padding:5px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;
                  color:var(--sub);font-size:12px;}
.eq-filter button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650;}
.eq-group{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
          padding:8px 12px;margin:12px 0 6px;border-radius:10px;background:#eef3fd;
          border-left:4px solid #3b6fd4;color:#1d3f7a;font-size:13px;font-weight:700;}
.eq-group .sub{font-weight:400;font-size:10.5px;color:#4a6fae;}
.eqrow{background:#fff;border-radius:12px;padding:9px 11px;margin-bottom:7px;
       box-shadow:0 1px 4px rgba(20,24,40,.05);cursor:pointer;}
.eqrow:active{transform:scale(.99);}
.eqrow-main{display:flex;align-items:center;gap:8px;}
.eqrow-name{flex:1;min-width:0;}
.eqrow-name b{display:block;font-size:14.5px;font-weight:650;line-height:1.35;}
.eqrow-name span{font-size:10.5px;color:var(--sub);}
.eqrow-pct{flex:0 0 auto;text-align:right;}
.eqrow-pct b{display:block;font-size:16px;color:var(--accent-ink);line-height:1.1;}
.eqrow-pct span{font-size:9.5px;color:var(--sub);}
.eqrow-act{flex:0 0 auto;min-width:42px;text-align:center;border-radius:8px;padding:4px 6px;
           font-size:12px;font-weight:700;}
.eqrow-act.a4{background:#e3f5ec;color:#0b6b46;}
.eqrow-act.a2{background:#e9f6ee;color:#1a7f37;}
.eqrow-act.a1{background:#eef0f3;color:#4b5563;}
.eqrow-act.a05{background:#fff3e3;color:#a85100;}
.eqrow-act.a0{background:#fdecea;color:#b3261e;}
.eqrow-sub{font-size:10.5px;color:var(--sub);margin-top:4px;line-height:1.5;}
.eq-summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 8px;}
/* 2026-11-05 详情卡重设计：结论句放大 + 一行 4 个大数，明细进折叠 */
.eq-concl{font-size:17px;font-weight:650;color:var(--text);line-height:1.5;flex:1;min-width:180px;}
.eq-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px;}
.eq-kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center;}
.eq-kpi .l{font-size:10px;color:var(--sub);line-height:1.3;}
.eq-kpi .v{font-size:19px;font-weight:750;margin-top:4px;line-height:1.2;
  font-variant-numeric:tabular-nums;}
.eq-act{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;}
.eq-act b{font-size:16px;color:var(--accent-ink);}
.eq-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;}
.eq-stat{background:#fafbfc;border-radius:8px;padding:6px 8px;}
.eq-stat .l{font-size:9.5px;color:var(--sub);line-height:1.3;}
.eq-stat .v{font-size:13px;font-weight:650;line-height:1.3;}
.eq-toggle{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 8px;}
.eq-toggle button{padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;
                  color:var(--sub);font-size:11.5px;}
.eq-toggle button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
/* v1.2 紧凑列表行（非卡片）· v1.4 简化：名称手机可两行、右侧「当前温度」 */
/* v1.5 指数列表改三列表格（用户 2026-10-31）：指数名称 | 近一周涨跌幅 | 当前温度 */
.eqi{display:grid;grid-template-columns:1fr 78px 62px 30px;gap:7px;align-items:center;
     padding:9px 2px;border-bottom:1px solid #edeff2;cursor:pointer;transition:background .1s;}
.eqi:active{background:#f6f7f9;}
.eqi-head{display:grid;grid-template-columns:1fr 78px 62px 30px;gap:7px;align-items:center;
     padding:5px 2px 6px;border-bottom:2px solid var(--line);font-size:10.5px;
     color:var(--sub);font-weight:650;letter-spacing:.2px;}
/* 自选星标（2026-11-05） */
.eqi-w{font-size:17px;text-align:center;color:#d5d9de;cursor:pointer;user-select:none;line-height:1;}
.eqi-w.on{color:#ff6a00;}
.eqi-head .r{text-align:right;}
.eqi-l{display:flex;align-items:center;gap:7px;min-width:0;}
.eqi-l .tier{flex:0 0 auto;min-width:0;padding:4px 6px;font-size:11px;}
.eqi-name{min-width:0;}
.eqi-name b{display:block;font-size:13.5px;font-weight:650;line-height:1.3;
            word-break:break-word;}
.eqi-code{font-size:9.5px;color:var(--sub);font-weight:500;}
.eqi-chg{text-align:right;font-size:13px;font-weight:650;line-height:1.2;
         font-variant-numeric:tabular-nums;color:var(--sub);}
.eqi-pct{text-align:right;font-size:15.5px;font-weight:700;line-height:1.2;
         font-variant-numeric:tabular-nums;}
/* v1.3 走势图左侧图例：每条线的图示说明（用户 2026-10-30） */
/* v1.4 搜索图标化 + 全量页（问题7/8/9） */
.eq-bar{display:flex;gap:6px;margin:2px 0 8px;align-items:center;}
.eq-bar input{flex:1;min-width:0;padding:8px 11px;border-radius:10px;border:1px solid var(--line);
  background:#fff;font-size:13px;color:var(--text);outline:none;}
.eq-sbtn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--sub);display:inline-flex;align-items:center;justify-content:center;}
.eq-sbtn:active{background:#fff6ef;}
#eqfull{position:absolute;inset:0;background:var(--bg);z-index:44;transform:translateX(100%);
  transition:transform .22s ease;visibility:hidden;display:flex;flex-direction:column;}
#eqfull.show{transform:translateX(0);visibility:visible;}
#eqfull .d-head{flex:0 0 auto;}
#eqfull-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 14px 20px;}
.eqfull-search{flex:0 0 auto;padding:0 14px 8px;}
.eqfull-search input{width:100%;padding:8px 11px;border-radius:10px;border:1px solid var(--line);
  background:#fff;font-size:13px;color:var(--text);outline:none;}
/* 2026-11-05 走势图重画：图例移到图下方横排（原左侧 92px 栏删除）；
   浅色粗线=估值口径原值、深色实线=指数点位、红/蓝/绿虚线=危险/中位/机会 */
.eq-chart-wrap{display:block;}
.eq-legend2{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:8px 0 2px;}
.eq-legend2 .lg{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--sub);white-space:nowrap;}
.eq-legend2 .ln{flex:0 0 16px;height:0;border-top:2px solid #1c5fd0;}
.eq-legend2 .ln.dark{border-top:2px solid #1f2937;}
.eq-legend2 .ln.blue{border-top:1.5px dashed #2456b8;}
.eq-legend2 .ln.red{border-top:1.5px dashed #b3261e;}
.eq-legend2 .ln.green{border-top:1.5px dashed #0b6b46;}
/* 红利天气图例线（2026-11-06）：股息率暖线 + 五条天气分档虚线 */
.eq-legend2 .ln.dy{border-top:2px solid #d97706;}
.eq-legend2 .ln.q70{border-top:1.5px dashed #d84315;}
.eq-legend2 .ln.q55{border-top:1.5px dashed #d97706;}
.eq-legend2 .ln.q45{border-top:1.5px dashed #64748b;}
.eq-legend2 .ln.q30{border-top:1.5px dashed #475569;}
.eq-legend2 .ln.q15{border-top:1.5px dashed #2563eb;}
/* ==== 2026-11-05 二轮：结论卡（参考市场情绪卡片）+ 点读数气泡 + 放大浮层 + 图例不挤 ==== */
/* 三轮微调：体感温度词=卡内最大元素（72px），当前倍数退到标签行右侧（30px） */
.eqv-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:8px 0 4px;}
.eqv-card .lab{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;color:#5c564c;}
.eqv-card .lab .cur{margin-left:auto;font-size:30px;font-weight:750;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1;}
.eqv-card .lab .cur .u{font-size:15px;font-weight:600;color:var(--sub);margin-left:4px;}
.eqv-card .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
.eqv-card .eqv-tier{font-size:72px;font-weight:800;line-height:1.04;margin-top:6px;letter-spacing:2px;}
.eqv-card .pb{display:flex;align-items:center;gap:12px;margin-top:14px;}

.gtrack{position:absolute;inset:0;border-radius:8px;overflow:hidden;}

.eq-chart{position:relative;}

#eqzoom{position:fixed;inset:0;z-index:120;background:rgba(20,18,15,.96);display:none;

#eqzoom svg{width:100%;height:auto;display:block;background:#fff;border-radius:10px;}
#eqzoom .zclose{position:absolute;top:12px;right:18px;color:#e8e3da;font-size:28px;cursor:pointer;z-index:2;}
/* 搜索框 + 查看更多 */
.eq-bar{margin:2px 0 8px;}

.eq-sort{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;

.eqfull-tabs{display:flex;gap:6px;padding:8px 14px 2px;background:var(--bg);}
.eqfull-tabs button{flex:1;min-height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;

.eqfull-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.eqfull-sortbar{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 14px 2px;background:var(--bg);font-size:11px;color:var(--sub);}
.eq-note{font-size:11.5px;color:var(--sub);line-height:1.55;}
/* v2.0 折叠「指标说明」 */
.eq-meth{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#faf8f4;

  color:var(--accent-ink);list-style:none;display:flex;align-items:center;gap:5px;}
.eq-meth summary::-webkit-details-marker{display:none;}
.eq-meth summary::before{content:'▸';font-size:11px;transition:transform .15s;}
.eq-meth[open] summary::before{transform:rotate(90deg);}
.eq-meth-body{padding:2px 12px 10px;border-top:1px solid var(--line);}
.eq-meth-row{display:flex;gap:8px;padding:5px 0;font-size:11.5px;line-height:1.6;
  border-bottom:1px dashed var(--line);}
.eq-meth-row:last-child{border-bottom:none;}
.eq-meth-row .k{flex:0 0 44px;color:var(--sub);font-weight:650;}
.eq-meth-row .v{flex:1;color:var(--ink);}
.eq-chart{background:#fff;border-radius:10px;padding:4px 2px 0;}
.cmp-bar[hidden]{display:none;}
.empty-tip{color:var(--sub);text-align:center;font-size:13px;padding:30px 0;}

/* ---------- 详情页 ---------- */
#detail{position:absolute;inset:0;background:var(--bg);z-index:50;transform:translateX(100%);

/* ---------- 池内横向对比 ---------- */
.pick{flex:0 0 auto;width:36px;height:36px;font-size:16px;border-radius:50%;border:1.5px solid var(--line);

.fundcard.picked{box-shadow:inset 0 0 0 2px var(--accent);background:#fff7f1;}
.fundcard.picked .pick{background:var(--accent);border-color:var(--accent);color:#fff;}
.cmp-bar{position:absolute;left:0;right:0;bottom:0;z-index:45;display:flex;align-items:center;gap:10px;

         box-shadow:0 -4px 16px rgba(20,24,40,.10);}
.cmp-bar .cnt{flex:1;font-size:12px;color:var(--sub);line-height:1.35;}
.cmp-bar .cnt b{color:var(--accent-ink);font-size:15px;}
.cmp-bar button{border:none;border-radius:16px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;}
.cmp-bar .go{background:var(--accent-ink);color:#fff;}
.cmp-bar .go:disabled{background:#e4e7ec;color:#5c6370;cursor:default;}
.cmp-bar .clr{background:#f1f2f5;color:var(--sub);}
#cmp{position:absolute;inset:0;background:var(--bg);z-index:60;transform:translateX(100%);

.cmp-note{font-size:10.5px;color:var(--sub);line-height:1.6;padding:9px 12px 0;}
.cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;margin:8px 12px 12px;border-radius:var(--radius);}
.cmp-tbl{border-collapse:collapse;font-size:11px;min-width:100%;}
.cmp-tbl th,.cmp-tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;white-space:nowrap;vertical-align:top;}
.cmp-tbl th.lbl,.cmp-tbl td.lbl{position:sticky;left:0;background:#fff;text-align:left;z-index:2;min-width:84px;max-width:110px;white-space:normal;}
.cmp-tbl thead th{background:#fff;position:sticky;top:0;z-index:3;color:var(--ink);}
.cmp-tbl thead th .nm{display:block;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.cmp-tbl thead th .rk{display:block;color:var(--sub);font-weight:400;}
.cmp-tbl tr.grp td{background:#f3f4f7;color:var(--sub);font-weight:600;text-align:left;}
.cmp-tbl tr.grp td .w{float:right;font-weight:400;}
.cmp-tbl td.best{color:var(--accent);font-weight:700;background:#fff7f1;}
.cmp-tbl td .bar{height:3px;border-radius:2px;background:#eceef1;margin-top:3px;}
.cmp-tbl td .bar i{display:block;height:100%;border-radius:2px;background:var(--accent);}
.cmp-tbl td .raw{display:block;color:var(--sub);font-size:10px;margin-top:2px;}
.cmp-tbl tr.chk td{background:#fbfbfc;font-weight:600;}
.cmp-copy{display:block;margin:0 12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
          padding:10px;font-size:13px;color:var(--ink);width:calc(100% - 24px);cursor:pointer;}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;background:rgba(28,30,34,.92);
       color:#fff;font-size:12px;padding:8px 14px;border-radius:16px;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
.d-head{background:linear-gradient(180deg,#ff8a3d,#ff6a00);color:#fff;padding:14px 16px 16px;
        position:sticky;top:0;z-index:5;}
.back{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
      border:none;border-radius:50%;font-size:17px;line-height:1;color:#fff;
      background:rgba(255,255,255,.22);margin-right:10px;cursor:pointer;}
.d-title{display:flex;align-items:center;}
.d-title .n{font-size:17px;font-weight:600;}
.d-scoreline{display:flex;gap:14px;margin-top:10px;font-size:12px;align-items:baseline;}
.d-scoreline b{font-size:20px;font-weight:700;}
.d-pick{margin-left:auto;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.55);color:#fff;
        border-radius:14px;min-height:36px;padding:9px 14px;font-size:12.5px;cursor:pointer;flex:0 0 auto;}
.d-pick.on{background:#fff;color:var(--accent-ink);font-weight:600;}
.sec{background:#fff;border-radius:var(--radius);margin:12px;padding:13px 14px;
     box-shadow:0 1px 4px rgba(20,24,40,.05);}
.sec h3{margin:0 0 10px;font-size:14.5px;font-weight:650;display:flex;justify-content:space-between;
        align-items:center;}
.sec h3 .hint{font-size:11px;color:var(--sub);font-weight:400;}
.winbar{display:flex;gap:6px;margin-bottom:8px;}
.win{min-height:36px;display:inline-flex;align-items:center;padding:6px 12px;font-size:12px;border-radius:12px;background:#f2f4f7;color:var(--sub);border:none;}
.win.on{background:var(--accent-ink);color:#fff;}
canvas{width:100%;height:150px;display:block;}
.stage{display:grid;grid-template-columns:repeat(6,1fr);}
.stage .m .v{font-size:13px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px 8px;}
.gcell{background:#fafbfc;border-radius:10px;padding:8px 10px;}
.gcell .l{font-size:11px;color:var(--sub);}
.gcell .v{font-size:15px;font-weight:650;margin-top:3px;}
.gcell .v small{font-size:11px;color:var(--sub);font-weight:400;}
table.yr{width:100%;border-collapse:collapse;font-size:13px;}
table.yr td,table.yr th{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line);}
table.yr th{color:var(--sub);font-size:11.5px;font-weight:500;}
table.yr tr:last-child td{border-bottom:none;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;}
.bar-row .bl{width:96px;color:var(--sub);flex:0 0 auto;text-align:right;}
.bar-bg{flex:1;height:9px;background:#f2f4f7;border-radius:5px;overflow:hidden;}
.bar{height:100%;border-radius:5px;background:linear-gradient(90deg,#ffb15e,#ff6a00);}
.bar-row .bv{width:44px;text-align:right;font-weight:600;font-size:12px;}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;
    border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--sub);}
.pctbar{position:relative;height:22px;background:#f2f4f7;border-radius:11px;margin:6px 0 2px;overflow:hidden;}
.pctbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffd28a,#ff9a3d);
              border-radius:11px;}
.pctbar .lbl{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:11.5px;
             color:#5a4632;padding-left:9px;font-weight:600;}
.mgr-name{font-size:15px;font-weight:650;}
.mgr-sub{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.6;}
.mgr-cards{display:flex;gap:8px;margin-top:9px;}
.mgr-cards .mc{flex:1;background:#fafbfc;border-radius:10px;padding:7px 8px;text-align:center;}
.mgr-cards .mc .v{font-size:15px;font-weight:650;color:var(--accent-ink);}
.mgr-cards .mc .l{font-size:10.5px;color:var(--sub);margin-top:2px;}
.disclaimer{font-size:11px;color:#69707e;line-height:1.7;padding:6px 16px 26px;}
/* v1.5 免责常显（用户 2026-10-31）：免责声明不再折叠、免点击直接显示，紧贴底部留白上方；
   底部 58px 留白仍为对比浮条预留（cmp-bar 浮底时会盖住免责尾部——只有用对比功能才遮挡）。
   账号行与免责之间无大留白，消除旧版"空白上移"问题。 */
.page-foot{flex:0 0 auto;display:flex;align-items:center;
  padding:5px 12px 3px;background:var(--bg);
  border-top:1px solid var(--line);font-size:11px;color:var(--sub);}
.page-foot b{color:var(--accent-ink);font-weight:650;}
.page-disc{flex:0 0 auto;font-size:10.5px;color:#69707e;line-height:1.6;text-align:left;
  padding:3px 14px calc(58px + env(safe-area-inset-bottom));background:var(--bg);}
.redline-tag{display:inline-block;background:#fff0f0;color:var(--up);border-radius:6px;
             font-size:11px;padding:1px 6px;margin-left:6px;}
/* ---------- 隐藏导出模式：?export=<pool>（仅 URL 触发，页面无入口） ----------
   把当期榜单画成社媒海报 PNG：小红书 3:4 / 公众号宽图 3:2，深色工作台背景 */
body.exp{display:block;overflow:auto;background:#20242c;}
.exp-wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px;color:#e8eaee;}
.exp-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;font-size:13px;}
.exp-bar .t{font-size:16px;font-weight:600;margin-right:auto;}
.exp-bar button{padding:7px 14px;border-radius:9px;border:1px solid #3a4048;background:#2a2f38;
                color:#e8eaee;font-size:13px;cursor:pointer;}
.exp-bar button.on{background:#ff6a00;border-color:#ff6a00;color:#fff;font-weight:600;}
.exp-bar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.exp-bar .grp b{font-size:11px;color:#9aa3ad;background:#2b3039;border:1px solid #3a4048;
  border-radius:7px;padding:3px 8px;font-weight:600;letter-spacing:1px;}
#mkt-stage{width:max-content;}
.exp-hint{color:#9aa3ad;font-size:12px;margin-bottom:12px;}
.exp-canvas-box{background:#fff;border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);}
#exp-canvas{width:100%;height:auto;display:block;}
/* bare=1：无 UI 裁切模式——隐藏所有操作条与画布盒装饰，画布 1:1 铺满视口（供自动化出图） */
body.bare{margin:0;padding:0;background:#f4f6f8;}
body.bare .exp-bar,body.bare .exp-hint{display:none;}
body.bare .exp-wrap{margin:0;padding:0;}
body.bare [class~="exp-canvas-box"]{background:none;padding:0;box-shadow:none;border-radius:0;}
body.bare #exp-canvas{width:100vw;height:auto;display:block;}
</style>

<div id="phone">

  <div class="tabbar" id="tabs"></div>

    <div class="eqfull-tabs" id="eqfull-tabs"></div>

    <button class="go" id="cmp-open" onclick="openCmp()" disabled>横向对比</button>
  </div>
  <div id="cmp" aria-hidden="true">
    <div class="d-head">
      <div class="d-title"><button class="back" onclick="closeCmp()">‹</button><span class="n">池内横向对比</span></div>
      <div class="d-scoreline"><span id="cmp-sub"></span></div>

</div>

<!-- 走势图放大浮层（2026-11-05）：点图读数/连点多点，点空白关闭 -->
<div id="eqzoom" onclick="eqZoomClose()">
  <span class="zclose">×</span>
  <div class="inner"><div id="eqzoom-body"></div></div>
</div>
<script src="data.js"></script>
<script src="market-export.js"></script>
<script>
/* ============ 工具 ============ */
const D = window.CARD_DATA;
/* 指数语境专属免责（2026-11-05 用户拍板：指数部分说"温度/估值分位"、不说"心动值"；
   榜单语境继续用 D.disclaimer 原版——那边说的是对的）。置于顶部避免任何 TDZ。 */
const DISC_EQ = '温度与估值分位均为历史数据自算的分析参考，不构成任何投资建议或基金推介；'
  + '数据来自公开渠道，可能存在延迟与错误。历史业绩不代表未来，不构成投资建议。';
const pct = (v, nd=2) => v==null ? '—' : (v*100).toFixed(nd)+'%';
const cls = v => v==null ? '' : (v>=0 ? 'pos' : 'neg');
const pctCls = v => v==null ? '' : (v>=0 ? 'pos' : 'neg');   /* 收益红、回撤本身用中性展示 */
const yi  = v => v==null ? '—' : v.toFixed(2)+'亿';
const $ = id => document.getElementById(id);
/* 分类标签：优先取 data.js 的 categories（config.CARD 为单一真源——2026-10-19 池名
   改为 中短债/长债/固收+ 后只需改 config 一处）；data.js 缺失/旧版时回退本地映射 */
const CATEGORY_LABELS = {short_bond:'中短债', long_bond:'长债', fixed_plus:'固收+', index:'债指',
  dur_s:'短久期', dur_m:'中久期', dur_l:'长久期'};   /* v5.23 久期三档（docs/17 §15） */
const TIER_SUB = {dur_s:'存单、1-3年等短端', dur_m:'3-5年、1-5年等中端', dur_l:'5-10年、7-10年等长端'};
const catLabel = c => {
  const hit = ((D && D.categories) || []).find(x => x && x.id === c);
  return (hit && hit.name) || CATEGORY_LABELS[c] || c || '';
};
/* 费率百分数：0.0025 → "0.25%"（去尾零）；0 → "0"；null → "—" */
const fpct = v => v==null ? '—' : ((v*100).toFixed(2).replace(/\.?0+$/,''))+'%';
/* 列表卡费率行：买入费率(天天基金优惠价，无优惠取原价) + 每年管理费率 */
function feeLine(fi){
  const buy = fi.purchase_fee_disc ?? fi.purchase_fee;   /* 优惠价优先 */
  if(buy==null && fi.mgmt_fee==null) return '费率 —';
  const parts = [];
  if(buy!=null) parts.push(`买入${fpct(buy)}`);
  if(fi.mgmt_fee!=null) parts.push(`管理${fpct(fi.mgmt_fee)}/年`);
  return '费率 ' + parts.join(' · ');
}
/* 详情页买入费率行：原价 + 天天基金优惠价（无优惠行只显原价） */
function feePurchase(fi){
  const o = fi.purchase_fee, d = fi.purchase_fee_disc;
  if(o==null && d==null) return '—';
  if(o!=null && d!=null && d<o) return `${fpct(o)}（天天基金优惠 ${fpct(d)}）`;
  return fpct(o ?? d);
}
/* 环比徽标：升↑红 / 降↓绿 / 平—灰 / 新增橙标；无历史（首期）→ 空 */
function rkHTML(f){
  if(f.is_new) return '<span class="rk new">新增</span>';
  if(f.rank_delta==null) return '';
  if(f.rank_delta>0) return `<span class="rk up">↑${f.rank_delta}</span>`;
  if(f.rank_delta<0) return `<span class="rk dn">↓${-f.rank_delta}</span>`;
  return '<span class="rk flat">—</span>';
}

/* ============ 分类 tab（启用分类由 data.pools 供数，点击切换榜单） ============ */
let ACTIVE = (window.CARD_DATA && window.CARD_DATA.category) || 'short_bond';
/* 逐池统计：pools 缺失（旧 data.js）→ 回退顶层单池字段 */
const poolStat = cat => (D.pools && D.pools[cat]) || null;
/* 该池筛选阈值（详情页文案按池显示）；旧 data.js 无 screen → 按分类回退默认口径 */
function screenOf(cat){
  const s = poolStat(cat);
  if (s && s.screen) return s.screen;
  return {scale_min_yi:5, comp_pct_min:0.45, yearly_median_min:0.55,
          spike_max_gain: cat==='long_bond' ? 0.02 : 0.01};
}
/* v1.7 四入口=四个独立内容区（用户 2026-10-31）：按主界面入口隔离，偏债/指数互不相通。
   偏债区=中短债/长债/固收+/债指；指数区=指数估值（内含宽基/行业/策略/海外分组）。
   页签栏只渲染当前区所属页签，两区无互切入口。旧 ?cat=/?group= 链接映射到对应区。 */
const SECTIONS = {
  bond:  {name:'偏债心动榜单', tabs:['short_bond','long_bond','fixed_plus','index']},
  index: {name:'指数温度计',   tabs:['eq_index']},
};
let SECTION = 'bond';   /* 当前内容区；默认偏债（旧直链无 section 参数时） */
function sectionOfCat(id){ return Object.keys(SECTIONS).find(s => SECTIONS[s].tabs.includes(id)) || 'bond'; }
const navCats = () => ((D && D.categories) || [])
  .filter(c => !(c && c.hidden))
  .filter(c => SECTIONS[SECTION].tabs.includes(c.id));   /* 只留本区页签 */
function renderTabs(active){
  /* 2026-11-05：底部免责按语境分——指数估值 tab 用温度版，其余用榜单原版 */
  const _pd = document.getElementById('p-disc');
  if (_pd) _pd.textContent = (active === 'eq_index') ? DISC_EQ
    : ((D && D.disclaimer) || DISCLAIMER_FALLBACK);
  const cats = navCats();
  /* v1.8 只有 1 个页签时不渲染页签条（指数区=指数估值，冗余）→ 白区直接铺满，顶栏统一 */
  if (cats.length <= 1){ $('tabs').innerHTML = ''; return; }
  $('tabs').innerHTML =
    '<div class="nav-tabs">'
      + cats.map(c => `<button class="tab ${c.id===active?'active':''} ${c.enabled?'':'disabled'}"
          ${c.enabled ? `onclick="switchTab('${c.id}')"` : 'disabled onclick="toast(\'该分类暂未开放\')"'}>
          ${c.name}${c.enabled?'':'<span class="soon">敬请期待</span>'}</button>`).join('')
      + '</div>';
}
function switchTab(id){
  const c = (D.categories||[]).find(x=>x.id===id);
  if(!c || !c.enabled) return;
  if (!SECTIONS[SECTION].tabs.includes(id)) return;   /* 跨区切断：本区外页签不可达 */
  ACTIVE = id;
  renderTabs(ACTIVE); renderList();
  CMP = []; renderPick();                       /* 跨池心动值不可比 → 切池清空对比选择 */
  document.getElementById('list').scrollTop = 0;
}

/* ============ 池内横向对比（榜内勾选 ≤5 只，仅同池可比） ============ */
const CMP_MAX = 5;
let CMP = [], CMP_TSV = '';
const DIM_LABELS = {
  mdd_5y:'近5年最大回撤', mdd_3y:'近3年最大回撤', mdd_1y:'近1年最大回撤', repair_5y:'回撤修复', vol_5y:'近5年波动',
  fee:'综合费率', ret_1y:'近1年年化', ret_3y:'近3年年化', ret_5y:'近5年年化', yearly_5y:'年度收益分位',
  q_excess_20q:'超额胜率(20季)', q_win_20q:'20季胜率', lvi_5y:'LVI(5年)', lvi_3y:'LVI(3年)',
  winrate_m_5y:'月度胜率(5年)', rank_stab:'排名稳定性', mgr_tenure:'现任任期', mgr_career:'经理从业年限',
  mgr_products_ann:'经理全产品年化', age:'基金年龄', ms_rating:'晨星评级', inst_ratio:'机构持有占比',
  fund_scale:'合并规模', company_scale:'公司非货规模', calmar_5y:'卡玛比(5年)', sharpe_5y:'夏普(5年)',
  fee_total:'综合费率', scale:'合并规模', idx_mgr_base:'同画像锚定'
};
/* v5.5 风格标签 → 徽标配色类（标签由服务端按池内候选中位计算，此处仅展示） */
const STYLE_CLS = {'进取型':'aggr','稳健型':'steady','防守型':'defen','震荡型':'wave'};
const num = (v, nd) => v == null ? '—' : Number(v).toFixed(nd == null ? 2 : nd);
/* 维度 → 原始值（有真实来源的才映射；否则回落 sub 分） */
/* v5.16 展示封顶（用户拍板「子项分最多显示100 + 共管×系数标注，计分不动」）：
   共管系数只留在计分（payload 原样），展示层把贡献折回系数前原值、附「共管×系数」。 */
const MGR3KEYS = ['mgr_tenure', 'mgr_career', 'mgr_products_ann'];
const coefOf = f => (f && f.manager && Number(f.manager.team_coef) > 1) ? Number(f.manager.team_coef) : 1;

const RAW_OF = {
  mdd_5y: f => pct(f.metrics.mdd_5y, 2), mdd_3y: f => pct(f.metrics.mdd_3y, 2), mdd_1y: f => pct(f.metrics.mdd_1y, 2),
  vol_5y: f => pct(f.metrics.vol_5y, 2),
  repair_5y: f => f.metrics.repair_days == null ? '—' : f.metrics.repair_days + '天',
  ret_1y: f => pct(f.metrics.ret_1y, 2), ret_3y: f => pct(f.metrics.ret_3y, 2), ret_5y: f => pct(f.metrics.ret_5y, 2),
  fee: f => pct(f.fund_info.fee_total, 2),
  fee_total: f => pct(f.fund_info.fee_total, 2), scale: f => yi(f.fund_info.scale_yi),
  lvi_5y: f => num(f.metrics.lvi_5y, 2), lvi_3y: f => num(f.metrics.lvi_3y, 2),
  winrate_m_5y: f => pct(f.metrics.winrate_m_5y, 1), q_win_20q: f => pct(f.metrics.q_win_20q, 1),
  q_excess_20q: f => pct(f.metrics.q_excess_20q, 1),
  yearly_5y: f => f.screening.yearly_med == null ? '—' : pct(f.screening.yearly_med, 0) + '分位',
  sharpe_5y: f => num(f.metrics.sharpe_5y, 2),
  calmar_5y: f => (f.metrics.mdd_5y && f.metrics.ret_5y != null) ? num(f.metrics.ret_5y / f.metrics.mdd_5y, 2) : '—',
  mgr_tenure: f => f.manager.tenure_days == null ? '—' : num(f.manager.tenure_days / 365, 1) + '年',
  mgr_career: f => f.manager.career_years == null ? '—' : num(f.manager.career_years, 1) + '年',
  mgr_products_ann: f => pct(f.manager.products_ann, 2),
  ms_rating: f => f.fund_info.ms_rating == null ? '—' : f.fund_info.ms_rating + '星',
  inst_ratio: f => pct(f.fund_info.inst_ratio, 1), fund_scale: f => yi(f.fund_info.scale_yi),
  age: f => f.fund_info.age == null ? '—' : num(f.fund_info.age, 1) + '年',
  company_scale: f => f.fund_info.company_scale == null ? '—' : String(f.fund_info.company_scale)
};
function poolWeightsOf(pid){ const s = (D && D.pools && D.pools[pid]) || null; return (s && s.weights) || null; }
function poolGroupsOf(pid){ const s = (D && D.pools && D.pools[pid]) || null; return (s && s.weight_groups) || null; }
function toast(msg){ const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1500); }
function rkTxt(f){ return f.is_new ? '新增' : (f.rank_delta > 0 ? '↑' + f.rank_delta
  : f.rank_delta < 0 ? '↓' + (-f.rank_delta) : '持平'); }

function pickTgl(code, ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  const i = CMP.indexOf(code);
  if(i >= 0) CMP.splice(i, 1);
  else if(CMP.length >= CMP_MAX){ toast('最多对比 ' + CMP_MAX + ' 只'); return; }
  else CMP.push(code);
  renderPick();
}
function detailPick(){
  if(!CUR) return;
  pickTgl(CUR.code);
  syncDetailPick();
}
function syncDetailPick(){
  const b = $('d-pick'); if(!b || !CUR) return;
  const on = CMP.indexOf(CUR.code) >= 0;
  b.textContent = on ? '移出对比' : '加入对比';
  b.classList.toggle('on', on);
  /* 债指不参与横向对比：组间/跨池分数不可比，且单列榜行已隐藏勾选按钮 */
  b.style.display = (D && D.pools && D.pools[CUR.category || D.category]) ? '' : 'none';
}
function clearCmp(){ CMP = []; renderPick(); }
function renderPick(){
  document.querySelectorAll('#list .fundcard').forEach(el => {
    const on = CMP.indexOf(el.dataset.code) >= 0;
    el.classList.toggle('picked', on);
    const b = el.querySelector('.pick'); if(b) b.textContent = on ? '✓' : '＋';
  });
  const n = CMP.length;
  $('cmp-bar').hidden = !n;
  $('list').style.paddingBottom = n ? '66px' : '';
  $('cmp-count').innerHTML = '已选 <b>' + n + '</b>/' + CMP_MAX + ' · ' + catLabel(ACTIVE) + '池（仅同池可比）';
  $('cmp-open').disabled = n < 2;
  syncDetailPick();                            /* 详情页按钮与榜单勾选双向同步 */
}

function openCmp(){
  const fs = CMP.map(c => (D.funds || []).find(f => f.code === c)).filter(Boolean)
               .sort((a, b) => a.rank - b.rank);
  if(fs.length < 2) return;
  const pid = fs[0].category || D.category || 'short_bond';
  const W = poolWeightsOf(pid), G = poolGroupsOf(pid), N = fs.length;
  const totW = W ? Object.keys(W).reduce((s, k) => s + (W[k] || 0), 0) : 0;
  const bestOf = vals => { if(vals.some(v => v == null || isNaN(v))) return -1;
    const mx = Math.max.apply(null, vals); return vals.findIndex(v => v === mx); };
  const grp = (n, w) => '<tr class="grp"><td class="lbl">' + n
    + (w ? '<span class="w">权重 ' + Number(w).toFixed(2) + '</span>' : '')
    + '</td>' + '<td></td>'.repeat(N) + '</tr>';
  const row = (label, cells, bi) => '<tr><td class="lbl">' + label + '</td>'
    + cells.map((c, i) => '<td' + (i === bi ? ' class="best"' : '') + '>' + c + '</td>').join('') + '</tr>';

  let H = '<table class="cmp-tbl"><thead><tr><th class="lbl"></th>'
    + fs.map(f => '<th><span class="nm">' + f.name + '</span>'
      + '<span class="rk">#' + f.rank + ' · ' + f.score + '</span></th>').join('')
    + '</tr></thead><tbody>';

  /* ① 综合概览 */
  H += grp('综合概览');
  H += row('综合心动值', fs.map(f => f.score == null ? '—' : f.score.toFixed(2)), bestOf(fs.map(f => f.score)));
  H += row('榜内位次', fs.map(f => '#' + f.rank), bestOf(fs.map(f => f.rank == null ? null : -f.rank)));
  H += row('风格', fs.map(f => f.style || '—'), -1);            /* v5.5 池内相对，仅展示 */
  H += row(pid === 'index' ? '指数族·久期段' : '经理', pid === 'index'
    ? fs.map(f => ((f.fund_info && f.fund_info.idx_fam) || '—')
        + ((f.fund_info && f.fund_info.idx_dur) ? ' · ' + f.fund_info.idx_dur : ''))
    : fs.map(f => ((f.manager && f.manager.name) || '—')
        + (f.manager && f.manager.seats >= 2 ? '（占席×' + f.manager.seats + '）' : '')), -1);
  H += row('较上期', fs.map(rkTxt), -1);
  H += row('红线', fs.map(f => (f.redlines && f.redlines.length) ? '⚠ ' + f.redlines.length + ' 条' : '—'), -1);
  if(W) H += row('载分率', fs.map(f => f.earned_weight == null ? '—'
      : (f.earned_weight / totW * 100).toFixed(0) + '%'), bestOf(fs.map(f => f.earned_weight)));

  /* ② 评分维度（按权重分块；每格 = 贡献分 / 权重 + 载分率条 + 原始值） */
  if(W){
    H += grp('心动值明细：贡献分 / 权重（条 = 载分率）');
    (G || [['心动值维度', Object.keys(W)]]).forEach(function(g){
      const keys = g[1].filter(k => W[k] != null);
      if(!keys.length) return;
      H += grp(g[0], keys.reduce((s, k) => s + (W[k] || 0), 0));
      keys.forEach(function(k){
        const w = Number(W[k]);
        const cells = fs.map(function(f){
          const sc = (f.sub_scores || {})[k], det = (f.score_detail || {})[k];
          if(sc == null) return '<span style="color:var(--sub)">—</span><span class="raw">数据不足·不计分</span>';
          /* v5.16 展示封顶（用户拍板）：共管系数（v5.7）作用在计分里，展示按系数前原值
             显示并标「共管×系数」——任何数字不超权重/100，计分契约不变（payload 原样） */
          const cd = (MGR3KEYS.indexOf(k) >= 0 && coefOf(f) > 1) ? coefOf(f) : 1;
          const det2 = det == null ? det : det / cd;
          const bar = w > 0 ? '<div class="bar"><i style="width:' + Math.min(100, (det2 || 0) / w * 100).toFixed(0) + '%"></i></div>' : '';
          return (det2 == null ? '—' : det2.toFixed(2)) + ' / ' + (w > 0 ? w.toFixed(2) : '—') + bar
            + '<span class="raw">' + (RAW_OF[k] ? RAW_OF[k](f) + (cd > 1 ? ' 共管×' + cd : '') : '分 ' + Math.min(100, sc)) + '</span>';
        });
        H += row((DIM_LABELS[k] || k) + (w > 0 ? '<span class="w" style="color:var(--sub);font-size:10px"> ' + w.toFixed(2) + '</span>' : ''),
                 cells, bestOf(fs.map(f => (f.score_detail || {})[k])));
      });
    });
  } else {
    H += grp('心动值明细（本期 data.js 未含权重，仅显示贡献分）');
    H += row('贡献分合计', fs.map(f => f.raw_score == null ? '—' : f.raw_score.toFixed(2)), -1);
  }

  /* ③ 关键原始指标（不计分，供人工核对） */
  H += grp('关键指标（不计分）');
  [['近5年年化', f => pct(f.metrics.ret_5y, 2)], ['近3年年化', f => pct(f.metrics.ret_3y, 2)],
   ['近1年年化', f => pct(f.metrics.ret_1y, 2)], ['近5年最大回撤', f => pct(f.metrics.mdd_5y, 2)],
   ['近5年波动', f => pct(f.metrics.vol_5y, 2)],
   /* 固收+：卡玛(5年)替代夏普（用户 2026-10-21；对比表同池同类别，标签取首只定） */
   [fs[0] && fs[0].category === 'fixed_plus' ? '卡玛(5年)' : '夏普(近5年)',
    f => f.category === 'fixed_plus'
      ? (f.metrics.mdd_5y && f.metrics.ret_5y != null
         ? num(f.metrics.ret_5y / f.metrics.mdd_5y, 2) : '—')
      : num(f.metrics.sharpe_5y, 2)],
   ['月度胜率(近5年)', f => pct(f.metrics.winrate_m_5y, 1)],
   ['修复天数', f => f.metrics.repair_days == null ? '—' : f.metrics.repair_days + '天'],
   ['综合费率', f => pct(f.fund_info.fee_total, 2)], ['合并规模', f => yi(f.fund_info.scale_yi)],
  ].concat(pid === 'index'
     ? [['久期段', f => (f.fund_info && f.fund_info.idx_dur) || '—']]
     : [['经理从业', f => f.manager.career_years == null ? '—' : num(f.manager.career_years, 1) + '年'],
        ['现任任期', f => f.manager.tenure_days == null ? '—' : num(f.manager.tenure_days / 365, 1) + '年']]
  ).concat([
   ['晨星评级', f => f.fund_info.ms_rating == null ? '—' : f.fund_info.ms_rating + '★'],
   ['机构占比', f => pct(f.fund_info.inst_ratio, 1)]
  ]).forEach(function(r){ H += row(r[0], fs.map(r[1]), -1); });
  const yrs = [];
  fs.forEach(f => Object.keys(f.yearly || {}).forEach(y => { if(yrs.indexOf(y) < 0) yrs.push(y); }));
  yrs.sort();
  yrs.forEach(y => H += row(y + ' 年收益', fs.map(f => (f.yearly && f.yearly[y] != null) ? pct(f.yearly[y], 2) : '—'), -1));

  /* ④ 校验行：Σ贡献 → 综合分（用于反推榜单算法） */
  H += grp('校验：Σ 贡献分 → 综合分');
  H += row('Σ 贡献分 = 原始总分', fs.map(f => f.raw_score == null ? '—' : f.raw_score.toFixed(2)), -1);
  H += row('× 100 ÷ 载分权重', fs.map(f => (f.raw_score == null || !f.earned_weight) ? '—'
      : (f.raw_score * 100 / f.earned_weight).toFixed(2)), -1);
  H += row('= 卡片上的心动值', fs.map(f => f.score == null ? '—' : f.score.toFixed(2)),
           bestOf(fs.map(f => f.score)));
  H += '</tbody></table>';

  $('cmp-body').innerHTML = H;
  $('cmp-sub').textContent = catLabel(pid) + '池 · 共 ' + fs.length + ' 只 · 数据基准 ' + D.asof
    + (W ? '' : '（旧版 data.js，无权重分区）');
  $('cmp-disc').textContent = D.disclaimer || '';
  CMP_TSV = cmpTSV(fs, W, totW);
  const el = $('cmp'); el.style.display = 'block';
  requestAnimationFrame(() => el.classList.add('show'));
  document.body.style.overflow = 'hidden';
}

/* 文本版对比表（复制到剪贴板，便于把人工反推结论记进本地档案） */
function cmpTSV(fs, W, totW){
  const L = [];
  L.push(['基金'].concat(fs.map(f => f.name)).join('\t'));
  L.push(['代码'].concat(fs.map(f => f.code)).join('\t'));
  L.push(['榜内排名'].concat(fs.map(f => '#' + f.rank)).join('\t'));
  L.push(['风格'].concat(fs.map(f => f.style || '—')).join('\t'));   /* v5.5 池内相对 */
  L.push(['经理'].concat(fs.map(f => ((f.manager && f.manager.name) || '—')
    + (f.manager && f.manager.seats >= 2 ? '（占席×' + f.manager.seats + '）' : ''))).join('\t'));
  L.push(['综合分'].concat(fs.map(f => f.score)).join('\t'));
  if(W){
    L.push(['载分率'].concat(fs.map(f => f.earned_weight == null ? '—'
      : (f.earned_weight / totW * 100).toFixed(0) + '%')).join('\t'));
    (poolGroupsOf(fs[0].category || D.category) || []).forEach(function(g){
      L.push('');
      const gw = g[1].reduce((s, k) => s + (W[k] || 0), 0);
      L.push(['【' + g[0] + '】' + (gw > 0 ? '权重 ' + gw.toFixed(2) : '')].join(''));
      g[1].filter(k => W[k] != null).forEach(function(k){
        L.push([DIM_LABELS[k] || k + '(' + Number(W[k]).toFixed(2) + ')'].concat(fs.map(function(f){
          const det = (f.score_detail || {})[k], sc = (f.sub_scores || {})[k];
          if(sc == null) return '—';
          const cd = (MGR3KEYS.indexOf(k) >= 0 && coefOf(f) > 1) ? coefOf(f) : 1;   /* v5.16 展示封顶同对比表 */
          return (det == null ? '—' : (det / cd).toFixed(2)) + '/' + Number(W[k]).toFixed(2)
            + ' ' + (RAW_OF[k] ? RAW_OF[k](f) + (cd > 1 ? ' 共管×' + cd : '') : '分' + Math.min(100, sc));
        })).join('\t'));
      });
    });
  }
  L.push('');
  L.push(['Σ贡献分'].concat(fs.map(f => f.raw_score)).join('\t'));
  L.push(['=心动值(复算)'].concat(fs.map(f => (f.raw_score != null && f.earned_weight)
    ? (f.raw_score * 100 / f.earned_weight).toFixed(2) : '—')).join('\t'));
  L.push('数据基准 ' + D.asof + ' · 仅池内可比，跨池不可比');
  return L.join('\n');
}
function cmpCopy(btn){
  const txt = CMP_TSV || '';
  const done = () => { const old = btn.textContent; btn.textContent = '已复制 ✓';
    setTimeout(() => { btn.textContent = old; }, 1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.cssText = 'position:fixed;top:-999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

/* 估值走势：内联 SVG（月度采样），避免 canvas 生命周期问题 */
function eqSparkSVG(x){
  const pts = (x.series || []).filter(p => p && p[1] != null);
  if (pts.length < 2) return '<div class="eq-line">走势数据不足</div>';
  const W = 640, H = 180, P = 12;
  const vals = pts.map(p => p[1]);
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const span = (mx - mn) || 1;
  const X = i => P + (W - 2 * P) * i / (pts.length - 1);
  const Y = v => H - P - (H - 2 * P) * (v - mn) / span;
  const d = pts.map((p,i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const med = x.range && x.range.median;
  const medY = (med != null) ? Y(med) : null;
  const col = tierColor(x.tier);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"
      role="img" aria-label="估值走势">
    ${medY != null ? `<line x1="${P}" y1="${medY.toFixed(1)}" x2="${W-P}" y2="${medY.toFixed(1)}"
      stroke="#c9cdd4" stroke-dasharray="4 4"/>` : ''}
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(pts[pts.length-1][1]).toFixed(1)}"
      r="3.6" fill="${col}"/>
    <text x="${P}" y="14" font-size="11" fill="#6b7280">${num(mx,2)}</text>
    <text x="${P}" y="${H-2}" font-size="11" fill="#6b7280">${num(mn,2)}</text>
    <text x="${W-P}" y="14" font-size="11" fill="#9aa0a6" text-anchor="end">${pts[0][0]} 起</text>
  </svg>`;
}

    data-mode="eq" data-unit="${isDy?'股息率':(metric==='pb'?'PB':'PE-TTM')}" data-pad="0.08"
    data-col="${lineCol}" data-w="${W}" data-h="${H}" data-l="${L}" data-r="${R}" data-t="${T}" data-b="${B}">
    <path d="${area}" fill="${areaCol}" stroke="none"/>
    ${refs}
    <path d="${path}" fill="none" stroke="${lineCol}" stroke-width="2" stroke-linejoin="round"/>`;
  // 指数点位（右轴）——按日期对齐 X（序列长度可与估值序列不同）
  if (cpts.length >= 2){
    const cv = cpts.map(p => +p[1]);
    let cmin = Math.min(...cv), cmax = Math.max(...cv);
    const cpad = (cmax - cmin || 1) * 0.06; cmin -= cpad; cmax += cpad;
    const CY = v => T + (H - T - B) * (1 - (v - cmin) / (cmax - cmin));
    const cpath = cpts.map((p,i) => (i?'L':'M') + Xd(p[0]).toFixed(1) + ' ' + CY(+p[1]).toFixed(1)).join(' ');
    svg += `<path d="${cpath}" fill="none" stroke="#1f2937" stroke-width="1.7"
      stroke-linejoin="round"/>`;
    svg += `<text x="${W-R+4}" y="${T+10}" font-size="10" fill="#1f2937">指数点位</text>`;
  }
  svg += `<circle cx="${X(mpts.length-1).toFixed(1)}" cy="${Y(+mpts[mpts.length-1][1]).toFixed(1)}"
      r="3.6" fill="${lineCol}" stroke="#fff" stroke-width="1.2"/>`;
  svg += `<text x="${L}" y="${T+10}" font-size="10" fill="#6b7280">${num(mx,2)}</text>`;
  svg += `<text x="${L}" y="${H-B-2}" font-size="10" fill="#6b7280">${num(mn,2)}</text>`;
  /* v1.3 横轴多刻度：起/25%/50%/75%/末（年月），不再只有首尾两个 */
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const i = Math.round((mpts.length - 1) * f);
    return {x: X(i), s: mpts[i][0].slice(0,7), first: f === 0, last: f === 1};
  });
  ticks.forEach(t => {
    svg += `<line x1="${t.x.toFixed(1)}" y1="${H-B}" x2="${t.x.toFixed(1)}" y2="${H-B+4}"
      stroke="#d5d9de" stroke-width="1"/>`;
    svg += `<text x="${t.x.toFixed(1)}" y="${H-8}" font-size="10" fill="#9aa0a6"`
      + ` text-anchor="${t.first?'start':(t.last?'end':'middle')}">${t.s}</text>`;
  });
  svg += `<text x="${W-R+4}" y="${H-B-2}" font-size="10" fill="${lineCol}">${num(+mpts[mpts.length-1][1],2)}</text>`;
  svg += '</svg>';
  return svg;
}
/* ==== 走势图点选读数（2026-11-05 用户拍板；移植自 market.html attachPicker）====
   点/触图上任意处 → 年月 · 估值值(PE-TTM/PB) · 点位；放大浮层可连点多点（multi）。
   data-pad 让焦点点位与本图 padding（0.08）一致；data-unit 槽位放指标名。 */
function attachPicker(svg, box, opts){
  opts = opts || {};
  if(!svg || !box || svg.dataset.wired || !svg.getAttribute('data-s')) return;
  svg.dataset.wired='1';
  var multi = !!opts.multi;
  var num=function(k,d){ var v=svg.getAttribute('data-'+k); return v==null?d:+v; };
  var W=num('w',660),H=num('h',330),L=num('l',44),R=num('r',54),T=num('t',18),B=num('b',30);
  var series=JSON.parse(decodeURIComponent(svg.getAttribute('data-s')));
  var s2a=svg.getAttribute('data-s2');
  var s2=s2a?JSON.parse(decodeURIComponent(s2a)):null;
  var mode=svg.getAttribute('data-mode')||'';
  var col=svg.getAttribute('data-col')||'#1c5fd0';
  var unit=svg.getAttribute('data-unit')||'';
  if(!series||series.length<2) return;
  var vals=series.map(function(p){return +p[1];});
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mode==='cmp'){ mn=0; mx=100; }
  var padF=parseFloat(svg.getAttribute('data-pad')||'0.1');
  var pad=(mx-mn||1)*padF; mn-=pad; mx+=pad;
  var X=function(i){return L+(W-L-R)*(i/(series.length-1));};
  var Y=function(v){return T+(H-T-B)*(1-(v-mn)/((mx-mn)||1));};
  var NS='http://www.w3.org/2000/svg';
  var guide=document.createElementNS(NS,'line');
  guide.setAttribute('stroke','#b9b1a3'); guide.setAttribute('stroke-dasharray','3 3');
  guide.setAttribute('stroke-width','1'); guide.setAttribute('visibility','hidden');
  svg.appendChild(guide);
  var dot=document.createElementNS(NS,'circle');
  dot.setAttribute('r','4.5'); dot.setAttribute('stroke','#fff'); dot.setAttribute('stroke-width','1.5');
  dot.setAttribute('visibility','hidden'); svg.appendChild(dot);
  var tip=document.createElement('div'); tip.className='ptip'; tip.style.display='none';
  box.appendChild(tip);
  var pins=[], pg=document.createElementNS(NS,'g'); svg.appendChild(pg);
  var strip=null;
  svg.style.cursor='pointer';
  if(multi){ strip=document.createElement('div'); strip.className='pinstrip'; strip.style.display='none'; box.appendChild(strip); }
  function tipText(i){
    if(mode==='eq'){
      var pt=(s2 && s2[i]!=null)?+s2[i][1]:null;
      var vv=vals[i];
      return series[i][0]+' · '+(unit||'PE')+' '+(Math.abs(vv)>=100?vv.toFixed(0):vv.toFixed(2))
        +(unit==='股息率'?'%':'')
        +(pt==null?'':' · 点位 '+Math.round(pt));
    }
    if(mode==='cmp'){
      var pe=s2?+s2[i][1]:null;
      return series[i][0]+' · 情绪分 '+Math.round(vals[i])+(pe==null?'':' · 点位 '+Math.round(pe));
    }
    var v=vals[i];
    var body=Math.abs(v)>=100?v.toFixed(0)
      :(v!==0&&Math.abs(v)<0.01?v.toFixed(4):v.toFixed(2));
    return series[i][0]+' · '+body+unit;
  }
  function renderPins(){
    while(pg.firstChild) pg.removeChild(pg.firstChild);
    if(!strip) return;
    if(!pins.length){ strip.style.display='none'; strip.innerHTML=''; return; }
    strip.style.display='flex';
    strip.innerHTML=pins.map(function(i,k){ return '<span class="pin">'+(k+1)+' '+tipText(i)+'</span>'; }).join('')
      +'<button class="pinclr" type="button">清空</button>';
    strip.querySelector('.pinclr').onclick=function(ev){ ev.stopPropagation(); pins=[]; renderPins(); hideTip(); };
    pins.forEach(function(i,k){
      var c=document.createElementNS(NS,'circle');
      c.setAttribute('cx',X(i).toFixed(1)); c.setAttribute('cy',Y(vals[i]).toFixed(1));
      c.setAttribute('r','6.5'); c.setAttribute('fill',col);
      c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','1.5');
      pg.appendChild(c);
      var t=document.createElementNS(NS,'text');
      t.setAttribute('x',X(i).toFixed(1)); t.setAttribute('y',(Y(vals[i])+2.8).toFixed(1));
      t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','8');
      t.setAttribute('font-weight','700'); t.setAttribute('fill','#fff');
      t.textContent=String(k+1); pg.appendChild(t);
    });
  }
  function hideTip(){ tip.style.display='none'; guide.setAttribute('visibility','hidden'); dot.setAttribute('visibility','hidden'); }
  function show(i, pin){
    var px=X(i), py=Y(vals[i]);
    guide.setAttribute('x1',px.toFixed(1)); guide.setAttribute('x2',px.toFixed(1));
    guide.setAttribute('y1',T); guide.setAttribute('y2',H-B);
    guide.setAttribute('visibility','visible');
    dot.setAttribute('cx',px.toFixed(1)); dot.setAttribute('cy',py.toFixed(1));
    dot.setAttribute('fill',col); dot.setAttribute('visibility','visible');
    tip.textContent=tipText(i); tip.style.display='block';
    tip.style.left=(px/((svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.width)||W)*100)+'%';
    tip.style.top=(py/H*100)+'%';
    if(multi && pin){
      var at=pins.indexOf(i);
      if(at>=0){ pins.splice(at,1); } else { if(pins.length>=8) pins.shift(); pins.push(i); }
      renderPins();
    }
  }
  svg.onclick=function(ev){
    var r=svg.getBoundingClientRect();
    var vbW=(svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.width)||W;
    var x=(ev.clientX-r.left)/Math.max(1,r.width)*vbW;
    var i=Math.round((x-L)/(W-L-R)*(series.length-1));
    i=Math.max(0,Math.min(series.length-1,i));
    show(i, multi);
    if(ev.stopPropagation) ev.stopPropagation();
  };
  if(opts.showLast) show(series.length-1, false);
}

   档位不靠超大字，靠色徽章/图标底色/浅底卡凸显；KPI 精简进折叠 ---- */
const TIER_BG = {'极低估':'#dff0fb','低估':'#e3f5ec','合理偏低':'#e9f6ee',
                 '正常':'#eef0f3','合理偏高':'#fff3e3','高估':'#fdecea'};
/* 天气分数：股息率(%) 按六档阈值折算百分制（与档位严格对齐，越高越晴） */
function wxScore(dyr){
  if (dyr == null) return null;
  const B = [[0,3.5,0,20],[3.5,4,20,40],[4,4.5,40,55],[4.5,5,55,70],[5,6,70,90],[6,7,90,100]];
  for (const b of B){
    if (dyr < b[1] || b[1] === 7){
      const t = Math.max(0, Math.min(1, (dyr - b[0]) / (b[1] - b[0])));
      return Math.round(b[2] + t * (b[3] - b[2]));
    }
  }
  return 100;
}

let CUR = null, WIN = '1y';

function openDetail(code){
  CUR = D.funds.find(f=>f.code===code); if(!CUR) return;
  /* v5.22：指数估值详情会改档位标签/颜色，回到基金详情时复位 */
  $('d-score-label').textContent = '综合心动值';
  $('d-score').style.color = '';
  /* 2026-11-05：从指数详情回来要恢复「加入对比」按钮（EQ 详情把它改成了加自选） */
  $('d-pick').style.display = '';
  $('d-pick').onclick = detailPick;
  $('d-pick').textContent = '加入对比';
  $('d-pick').classList.remove('on');
  WIN = '1y';
  $('d-name').textContent = CUR.name;
  $('d-score').textContent = CUR.score;
  /* 头部名次：分母 = 该基金所在池的 n（pools 缺失回退顶层 n）；含环比后缀 */
  const ps = poolStat(CUR.category);
  /* v5.12 债指单列：名次分母 = 所在组（中短债/长债各自成榜，跨组分数不可比） */
  /* v5.23：名次为久期档内名次、n 按档；旧数据无 idx_tier → 回退 idx_group */
  const _tier = CUR.idx_tier || CUR.idx_group;
  const gn = CUR.idx_tier_n || CUR.idx_group_n || (ps && ps.n) || D.n;
  let rk = `第 ${CUR.rank} 名 / ${gn}`
    + (_tier ? `（${catLabel(_tier)}债指）` : '');
  if(CUR.is_new) rk += '（新增）';
  else if(CUR.rank_delta!=null) rk += CUR.rank_delta>0 ? `（较上期 ↑${CUR.rank_delta}）`
      : CUR.rank_delta<0 ? `（较上期 ↓${-CUR.rank_delta}）` : '（较上期 持平）';
  $('d-rank').textContent  = rk;
  $('d-code-inline').textContent = CUR.code;      /* 详情标题行内代码（2026-10-20 用户要求） */
  $('d-code').textContent  = catLabel(CUR.category)
    + (CUR.style ? ' · ' + CUR.style : '')        /* v5.5 风格标签（池内相对，仅展示） */
    + (CUR.purchase_status ? ' · 申购：' + CUR.purchase_status : '');
  $('d-disc').textContent  = D.disclaimer;
  syncDetailPick();
  $('d-body').innerHTML = bodyHTML(CUR);
  const el = $('detail'); el.style.display='block';
  requestAnimationFrame(()=>el.classList.add('show'));
  drawTrend();
  document.body.style.overflow='hidden';
}
function closeDetail(){
  const el=$('detail'); el.classList.remove('show');
  setTimeout(()=>{el.style.display='none';},220);
  document.body.style.overflow='';
  /* 红利天气卡片墙进来的详情 → 返回卡片墙（2026-11-06 用户反馈，原来会退回指数列表） */
  if (EQ_WX_BACK){ EQ_WX_BACK = false; location.href = 'weather.html'; }
}

  fee_total:'总费率', scale:'基金规模', idx_mgr_base:'同画像锚定（对齐同画像主动中位）',
};

/* ============ 走势图 ============ */
function setWin(k){ WIN=k; document.querySelectorAll('.win').forEach(b=>
    b.classList.toggle('on', b.textContent==={'1y':'近1年','3y':'近3年','5y':'近5年'}[k])); drawTrend(); }

/* 取指定窗口曲线：data.js 只发 1y+5y；3y 从 5y 按日期切片（1y⊂3y⊂5y 完全重叠）。
   旧版 data.js 仍含 3y 键 → 直接命中，前向兼容。 */
function trendSeries(f, win){
  const t = f.trend || {};
  if((t[win]||[]).length) return t[win];
  if(win==='3y' && (t['5y']||[]).length){
    const pts = t['5y'];
    const end = new Date(pts[pts.length-1][0]+'T00:00:00');
    const cut = new Date(end); cut.setFullYear(cut.getFullYear()-3);
    const iso = cut.toISOString().slice(0,10);
    const sub = pts.filter(p=>p[0]>=iso);
    if(sub.length>=2) return sub;
  }
  return [];
}

function drawTrend(){
  const cv = $('trend'); if(!cv || !CUR) return;
  const pts = trendSeries(CUR, WIN); if(pts.length<2) return;
  const ctx = cv.getContext('2d');
  /* 逻辑坐标固定 710×300（视觉口径不变），按设备像素比放大内部分辨率防发糊 */
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const dispW = cv.clientWidth || 710, dispH = cv.clientHeight || 300;
  const LW = 710, LH = 300;
  if(cv.width !== Math.round(dispW*dpr) || cv.height !== Math.round(dispH*dpr)){
    cv.width = Math.round(dispW*dpr); cv.height = Math.round(dispH*dpr);
  }
  ctx.setTransform(dpr*dispW/LW, 0, 0, dpr*dispH/LH, 0, 0);
  const W = LW, H = LH, PADL=54, PADR=12, PADT=14, PADB=24;
  ctx.clearRect(0,0,W,H);
  // 归一化为累计收益率
  const base = pts[0][1];
  const ys = pts.map(p=>(p[1]/base-1));
  const y0 = 0, y1 = Math.max(...ys), y2 = Math.min(...ys, 0);
  const span = (y1-y2) || 1;
  const X = i => PADL + i*(W-PADL-PADR)/(pts.length-1);
  const Y = v => PADT + (y1-v)/span*(H-PADT-PADB);
  // 网格 + 纵轴标签
  ctx.font = '18px sans-serif'; ctx.fillStyle='#9aa0a6'; ctx.strokeStyle='#eef0f3'; ctx.lineWidth=1.5;
  for(let g=0; g<=4; g++){
    const v = y2 + span*g/4, y = Y(v);
    ctx.beginPath(); ctx.moveTo(PADL,y); ctx.lineTo(W-PADR,y); ctx.stroke();
    ctx.fillText((v*100).toFixed(1)+'%', 6, y+6);
  }
  // 零线
  ctx.strokeStyle='#d0d4da'; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(PADL,Y(0)); ctx.lineTo(W-PADR,Y(0)); ctx.stroke(); ctx.setLineDash([]);
  // 曲线
  const grad = ctx.createLinearGradient(0,PADT,0,H-PADB);
  grad.addColorStop(0,'rgba(255,106,0,.28)'); grad.addColorStop(1,'rgba(255,106,0,0)');
  ctx.beginPath(); ctx.moveTo(X(0), Y(ys[0]));
  ys.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.strokeStyle='#ff6a00'; ctx.lineWidth=3; ctx.stroke();
  ctx.lineTo(X(ys.length-1),H-PADB); ctx.lineTo(X(0),H-PADB); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
  // 首尾日期
  ctx.fillStyle='#9aa0a6'; ctx.fillText(pts[0][0].slice(2), PADL, H-6);
  const last = pts[pts.length-1][0].slice(2);
  ctx.fillText(last, W-PADR-ctx.measureText(last).width, H-6);
  // 端点值
  ctx.fillStyle='#ff6a00'; ctx.fillText((ys[ys.length-1]*100).toFixed(2)+'%',
     Math.max(PADL, X(ys.length-1)-90), Math.max(PADT+14, Y(ys[ys.length-1])-10));
}

/* ============ 隐藏导出模式（?export=<pool>|all，页面无入口，仅 URL 触发） ============
   用法：web/index.html?export=all[&size=xhs|wide][&rows=N]   ← 工作台：全部启用分类页签 + 一键下载全部
         web/index.html?export=short_bond|long_bond[...]      ← 直达某一分类（页签预选该池）
     size 默认 xhs（小红书 2:3 1080×1620，20 行）；wide = 公众号宽图 3:2 1200×800（10 行）
   产出：当期榜单 → 社媒海报 PNG（canvas 绘制，可直接下载发小红书/公众号）。
   数字全部取自 data.js（与页面同源），杜绝"旧图新发"。 */
const EXPORT_SIZES = {
  xhs:  {w:1080, h:1620, rows:20, label:'小红书 2:3（1080×1620，TOP20）'},
  wide: {w:1200, h:800,  rows:10, label:'公众号宽图 3:2（1200×800，TOP10）'},
  cover:{w:1200, h:510,  rows:10, label:'公众号封面 2.35:1（1200×510，仅情绪封面）'},
};
function exportRows(pool, rows){
  if (pool === 'eq_index'){
    const list = ((D && D.eq_index && D.eq_index.indices) || [])
      .filter(x => !isWeatherIdx(x))              /* 红利族已拆到天气模块（2026-11-06） */
      .slice()
      .sort((a,b) => (EQ_GROUP_ORDER.indexOf(a.group) - EQ_GROUP_ORDER.indexOf(b.group))
        || (a.percentile - b.percentile));
    return rows ? list.slice(0, rows) : list;
  }
  if (pool === 'div_weather'){
    /* 红利天气导出：按综合分从高到低（2026-11-06 用户：排序按分数高低；分空回退股息率） */
    const sOf = x => (x.score != null ? x.score : (x.dyr != null ? x.dyr : -1));
    const list = ((D && D.eq_index && D.eq_index.indices) || [])
      .filter(x => isWeatherIdx(x))
      .slice()
      .sort((a, b) => sOf(b) - sOf(a));
    return rows ? list.slice(0, rows) : list;
  }
  const list = ((D && D.funds) || [])
    .filter(f => (f.category || (D && D.category) || 'short_bond') === pool)
    .sort((a,b) => (a.rank||0) - (b.rank||0));
  return rows ? list.slice(0, rows) : list;
}
function _fitText(ctx, text, maxW){
  text = String(text == null ? '' : text);
  if (ctx.measureText(text).width <= maxW) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
  return text + '…';
}
function _wrapText(ctx, text, maxW, maxLines){
  const out = []; let cur = '';
  for (const ch of String(text)) {
    if (ctx.measureText(cur + ch).width > maxW) { out.push(cur); cur = ch; if (out.length === maxLines) break; }
    else cur += ch;
  }
  if (out.length < maxLines && cur) out.push(cur);
  return out;
}
function _deltaTxt(f, hasPrev){
  if (!hasPrev) return '';
  if (f.is_new) return '新增';
  const d = f.rank_delta;
  if (d == null) return '—';
  return d > 0 ? '↑' + d : (d < 0 ? '↓' + (-d) : '—');
}
/* v5.22 指数估值导出：按宽基/行业/策略/海外分段，只画指数行（不含具体基金）。
   63 行手机图不可读 → 默认按尺寸行数（xhs 20 / wide 10），显式 &rows 可覆盖。 */
/* ============ 每周导出海报骨架（2026-11-06 用户拍板重设计）============
   品牌行 → 模块渐变细条 → 副标题 → 三张 stat 卡 → 整卡带色头分区 → 页脚；
   横版：温度计左右双栏、天气双栏（阳光+多云阴 | 雨）。cfg 由各导出函数组装。 */
function drawZonePoster(canvas, S, cfg){
  const W = S.w, H = S.h, PAD = 44;
  const wide = W > H;
  const foot = Math.round(H * (wide ? 0.17 : 0.14));
  const footTop = H - foot;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const rr = (x,y,w,h,r) => {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  };
  ctx.fillStyle = '#faf7f2'; ctx.fillRect(0, 0, W, H);

  /* 品牌行 + 日期胶囊 */
  ctx.fillStyle = '#ff6a00'; rr(PAD, wide ? 24 : 28, 10, wide ? 36 : 42, 5); ctx.fill();
  ctx.fillStyle = '#26231e'; ctx.font = '700 ' + (wide ? 29 : 35) + 'px sans-serif';
  ctx.fillText('班马日记本 · ' + cfg.title, PAD + 22, wide ? 58 : 66);
  const pill = '估值日期 ' + ((D.eq_index && D.eq_index.asof) || '—');
  ctx.font = (wide ? 14 : 16) + 'px sans-serif';
  const pw = ctx.measureText(pill).width + 28, ph = wide ? 30 : 34;
  ctx.fillStyle = '#ffe9d9'; rr(W - PAD - pw, wide ? 26 : 30, pw, ph, ph/2); ctx.fill();
  ctx.fillStyle = '#b3541e'; ctx.fillText(pill, W - PAD - pw + 14, (wide ? 26 : 30) + ph * 0.68);

  /* 模块渐变细条（拍板①：温度计=绿黄红，天气=橙灰蓝） */
  const gy = wide ? 70 : 80;
  const g = ctx.createLinearGradient(PAD, 0, W - PAD, 0);
  cfg.grad.forEach((c, i) => g.addColorStop(i / (cfg.grad.length - 1), c));
  ctx.fillStyle = g; rr(PAD, gy, W - PAD * 2, 6, 3); ctx.fill();

  /* 副标题 */
  ctx.fillStyle = '#8a8378'; ctx.font = (wide ? 14 : 16) + 'px sans-serif';
  ctx.fillText(cfg.subtitle, PAD, gy + (wide ? 24 : 27));

  /* 三张 stat 卡（拍板②：大数字 + 小标签） */
  const stY = gy + (wide ? 34 : 40), stH = wide ? 56 : 66;
  const sgap = wide ? 10 : 12, scw = (W - PAD * 2 - sgap * 2) / 3;
  cfg.stats.forEach((s, i) => {
    const x = PAD + i * (scw + sgap);
    ctx.save(); ctx.shadowColor = 'rgba(38,35,30,.05)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#ffffff'; rr(x, stY, scw, stH, 12); ctx.fill(); ctx.restore();
    ctx.fillStyle = s.c; ctx.font = '800 ' + (wide ? 27 : 32) + 'px sans-serif';
    ctx.fillText(String(s.n), x + 16, stY + (wide ? 35 : 42));
    ctx.fillStyle = '#8a8378'; ctx.font = '600 ' + (wide ? 12.5 : 14.5) + 'px sans-serif';
    ctx.fillText(s.t, x + 16, stY + (wide ? 51 : 60));
  });

  /* 分区布局：竖版单列堆叠；横版双栏（cfg.twoCol → cfg.cols） */
  const cardsTop = stY + stH + (wide ? 12 : 14);
  const avail = footTop - cardsTop - 6;
  const GAP = 14;
  const cols = (wide && cfg.twoCol) ? cfg.cols : [cfg.zones];
  const colGap = (wide && cfg.twoCol) ? 16 : 0;
  const colW = (W - PAD * 2 - (cols.length - 1) * colGap) / cols.length;
  let rowH = wide ? 26 : 40;
  const rowHMin = wide ? 22 : 28;

  /* 自适应：放不下先降行高，到下限仍放不下则从列尾（末区）截断并标注 */
  cols.forEach(zs => {
    const rows = zs.reduce((s, z) => s + z.list.length, 0);
    const fixed = zs.reduce((s, z) => s + 104 + (z.note ? 30 : 18), 0) + (zs.length - 1) * GAP;
    if (rows * rowH + fixed <= avail) return;
    const fh = Math.floor((avail - fixed) / Math.max(1, rows));
    if (fh >= rowHMin) { rowH = Math.min(rowH, fh); return; }
    rowH = rowHMin;
    const rem = Math.floor((avail - fixed - 30) / rowHMin);   /* 预留截断注释行 */
    for (let zi = zs.length - 1; zi >= 0; zi--) {
      const z = zs[zi];
      const otherRows = zs.reduce((s, q, i) => i === zi ? s : s + q.list.length, 0);
      const cap = rem - otherRows;
      if (z.list.length > cap && cap >= 2) {
        z.note = '共 ' + z.n + ' 只 · 本图列前 ' + cap + ' 只';
        z.list = z.list.slice(0, cap);
        break;
      }
    }
  });

  /* 整卡带色头（拍板③）：白卡 + 色头条（图标+区名+数量徽章）+ 列标签 + 行 */
  const drawCard = (x, y, w, z) => {
    const n = z.list.length;
    const rowsY = 108;
    /* 自然高度：双栏定高会在行少的卡下留大片白块（2026-11-06 雨景区反馈） */
    const h = rowsY + n * rowH + (z.note ? 30 : 18);
    ctx.save(); ctx.shadowColor = 'rgba(38,35,30,.06)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#ffffff'; rr(x, y, w, h, 14); ctx.fill(); ctx.restore();
    ctx.fillStyle = z.tint; rr(x + 12, y + 12, w - 24, 44, 10); ctx.fill();
    ctx.font = '19px sans-serif'; ctx.fillText(z.icon, x + 26, y + 42);
    ctx.fillStyle = z.color; ctx.font = '700 ' + (wide ? 15.5 : 17.5) + 'px sans-serif';
    ctx.fillText(z.t, x + 52, y + 40);
    ctx.font = '700 ' + (wide ? 13 : 14) + 'px sans-serif';
    const btxt = '共 ' + z.n + ' 只';
    const bw = ctx.measureText(btxt).width + 24;
    ctx.fillStyle = z.color; rr(x + w - 12 - bw, y + 19, bw, 30, 15); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(btxt, x + w - 12 - bw + 12, y + 39);
    /* 列位是相对卡宽的 → 平移到卡片绝对 x（2026-11-06 修复：否则行按绝对坐标画，
       xhs 名称画到卡外、横版两列行互相覆盖——热区盖进冷区/雨区错进左列） */
    const px = z.cells(w);
    ['nameX', 'badgeRight', 'pctR', 'peR', 'pbR', 'scoreR', 'dyrR', 'refR', 'retR'].forEach(k => {
      if (typeof px[k] === 'number') px[k] += x;
    });
    px.lab = px.lab.map(v => typeof v === 'number' ? v + x : v);
    ctx.fillStyle = '#a39a8c'; ctx.font = '600 ' + (wide ? 11.5 : 12.5) + 'px sans-serif';
    const labels = px.labels || z.labels;        /* 横版天气少一列（分位参考） */
    labels.forEach((L, i) => {
      if (!L || px.lab[i] == null) return;
      if (px.labAlign[i] === 'r') {
        ctx.textAlign = 'right'; ctx.fillText(L, px.lab[i], y + 92); ctx.textAlign = 'left';
      } else ctx.fillText(L, px.lab[i], y + 92);
    });
    z.list.forEach((item, i) => {
      const ry = y + rowsY + i * rowH;
      if (i % 2 === 1) { ctx.fillStyle = '#fbfaf7'; rr(x + 6, ry, w - 12, rowH, 7); ctx.fill(); }
      z.render(ctx, rr, ry, item, w, rowH, px, wide);
    });
    if (z.note) {
      ctx.fillStyle = '#a39a8c'; ctx.font = (wide ? 12 : 13.5) + 'px sans-serif';
      ctx.fillText(z.note, x + 16, y + rowsY + n * rowH + (wide ? 18 : 22));
    }
    return h;
  };

  cols.forEach((zs, ci) => {
    const cx = PAD + ci * (colW + colGap);
    let cy = cardsTop;
    zs.forEach(z => {
      const fixedH = (cols.length > 1 && zs.length === 1) ? avail : null;
      cy += drawCard(cx, cy, colW, z, fixedH) + GAP;
    });
  });

  /* 页脚：橙色行动句 + 免责 + 账号 */
  const fy = footTop;
  ctx.fillStyle = '#ff6a00'; ctx.font = '700 ' + (wide ? 17 : 21) + 'px sans-serif';
  ctx.fillText(cfg.footer, PAD, fy + 26);
  ctx.fillStyle = '#8a8378'; ctx.font = (wide ? 12.5 : 14.5) + 'px sans-serif';
  _wrapText(ctx, cfg.disc, W - PAD * 2, 3).forEach((ln, i) => ctx.fillText(ln, PAD, fy + 56 + i * 18));
  ctx.textAlign = 'right'; ctx.fillStyle = '#9aa0a6';
  ctx.fillText('@班马成长日记', W - PAD, fy + 26); ctx.textAlign = 'left';
  const shownRows = cols.reduce((s, zs) => s + zs.reduce((t, z) => t + z.list.length, 0), 0);
  return {width: W, height: H, rows: cfg.rows != null ? cfg.rows : shownRows};
}

/* 红利天气导出（2026-11-06 拍板；同日按海报骨架重设计）：三区（阳光/多云阴/雨）、
   天气徽章配色随档位；列=指数/天气/股息率/分位参考/近1周。 */
function _drawWeatherExport(canvas, S, rowsLimit){
  const all = exportRows('div_weather');   /* 按当前股息率降序；版面由海报骨架自适应 */
  const cellsWx = w => {
    /* 列：指数 | 天气徽章 | 分数 | 股息率 | 分位参考 | 近1周；列距拉开（2026-11-06 用户：
       分数/股息率/分位参考太挤）——横版卡窄（<700）去掉分位参考列换间距，竖版保留6列 */
    const wide = w < 700;
    const retR = w - 16;
    if (wide) {
      const dyrR = retR - 104, scoreR = dyrR - 86, badgeRight = scoreR - 78;
      return {nameX: 16, nameW: Math.max(56, badgeRight - 96), badgeRight: badgeRight,
              scoreR: scoreR, dyrR: dyrR, refR: null, retR: retR,
              lab: [16, null, scoreR, dyrR, retR], labAlign: ['l', null, 'r', 'r', 'r'],
              labels: ['指数', '', '分数', '股息率', '近1周']};
    }
    const refR = retR - 104, dyrR = refR - 86, scoreR = dyrR - 86, badgeRight = scoreR - 78;
    return {nameX: 16, nameW: Math.max(56, badgeRight - 96), badgeRight: badgeRight,
            scoreR: scoreR, dyrR: dyrR, refR: refR, retR: retR,
            lab: [16, null, scoreR, dyrR, refR, retR], labAlign: ['l', null, 'r', 'r', 'r', 'r'],
            labels: ['指数', '', '分数', '股息率', '分位参考', '近1周']};
  };
  const renderWx = (ctx, rr, ry, x, w, rowH, px, wide) => {
    const fN = wide ? 17.5 : 23, fD = wide ? 13.5 : 17;
    const l1 = ry + Math.round(rowH / 2 + fN * 0.36);
    ctx.fillStyle = '#26231e'; ctx.font = '600 ' + fN + 'px sans-serif';
    ctx.fillText(_fitText(ctx, x.name, px.nameW), px.nameX, l1);
    const wc = WEATHER_TC[x.weather] || ['#eef0f3', '#4b5563'];
    const bw = Math.max(wide ? 52 : 64, ctx.measureText(x.weather).width + (wide ? 18 : 26));
    const bh = Math.max(19, Math.round(rowH * 0.56));
    ctx.fillStyle = wc[0]; rr(px.badgeRight - bw, ry + Math.round((rowH - bh) / 2), bw, bh, bh / 2); ctx.fill();
    ctx.fillStyle = wc[1]; ctx.font = '700 ' + (wide ? 13 : 15) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.fillText(x.weather, px.badgeRight - bw / 2, ry + rowH / 2 + (wide ? 5 : 6));
    ctx.textAlign = 'right';
    /* 分数（百分制综合分，档位色）→ 股息率（墨色加粗）→ 分位参考（灰）→ 近1周（涨红跌绿） */
    ctx.fillStyle = wc[1]; ctx.font = '700 ' + (wide ? 16 : 20) + 'px sans-serif';
    ctx.fillText(x.score == null ? '—' : (+x.score).toFixed(1), px.scoreR, l1);
    ctx.fillStyle = '#26231e'; ctx.font = '700 ' + (wide ? 15 : 18.5) + 'px sans-serif';
    ctx.fillText(x.dyr == null ? '—' : x.dyr.toFixed(2) + '%', px.dyrR, l1);
    if (px.refR != null) {                       /* 横版无分位参考列 */
      ctx.fillStyle = '#9a938a'; ctx.font = (wide ? 13 : 16) + 'px sans-serif';
      ctx.fillText(x.dyr_pct == null ? '—' : x.dyr_pct.toFixed(1) + '%', px.refR, l1);
    }
    ctx.fillStyle = x.ret_1w == null ? '#9aa0a6' : (x.ret_1w >= 0 ? '#b3261e' : '#0b6b46');
    ctx.font = (wide ? 13 : 16) + 'px sans-serif';
    ctx.fillText(x.ret_1w == null ? '—' : (x.ret_1w >= 0 ? '+' : '') + (x.ret_1w * 100).toFixed(2) + '%', px.retR, l1);
    ctx.textAlign = 'left';
  };
  const mk = (t, icon, tint, color, ws) => {
    const list = all.filter(x => ws.includes(x.weather));
    return {t, icon, tint, color, n: list.length, list, note: '',
            labels: ['指数', '', '分数', '股息率', '分位参考', '近1周'], cells: cellsWx, render: renderWx};
  };
  const sunZ  = mk('阳光区 · 越高越晴', '🌞', '#fef3c7', '#d97706', ['酷暑', '晴天']);
  const midZ  = mk('多云阴天 · 中性', '⛅', '#eaeff4', '#64748b', ['多云', '阴天']);
  const rainZ = mk('雨景区 · 越低越贵', '🌧️', '#e0ebfd', '#2563eb', ['小雨', '暴雨']);
  const zones = [sunZ, midZ, rainZ].filter(z => z.n > 0);

function drawExport(canvas, pool, sizeKey, rows){
  const S = EXPORT_SIZES[sizeKey] || EXPORT_SIZES.xhs;
  if (pool === 'div_weather') return _drawWeatherExport(canvas, S, rows);
  /* 2026-11-07 拍板：指数温度计导出（eq_index/_drawEqExport）删除，估值并入 market_weekly */
  const ps = (D && D.pools && D.pools[pool]) || {};
  const hasPrev = ps.has_prev != null ? !!ps.has_prev : !!(D && D.has_prev);
  /* 债指（v5.17）：全量分组绘制，不套尺寸默认行数（用户 2026-10-22 拍板"截断不合理"）；显式 &rows 仍生效 */
  const funds = exportRows(pool, rows || (pool === 'index' ? null : S.rows));

  const rr = (x, y, w, h, r) => {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  };
  const right = (txt, x, y) => { ctx.textAlign = 'right'; ctx.fillText(txt, x, y); ctx.textAlign = 'left'; };

    ctx.fillStyle = '#b3aca2'; ctx.font = (wide ? 14 : 15) + 'px sans-serif';
    const lines = _wrapText(ctx, (D && D.disclaimer) || DISCLAIMER_FALLBACK, W - PAD * 2, 3);
    lines.forEach((ln, i) => ctx.fillText(ln, PAD, fy + 8 + pH + 56 + i * 20));

  /* ---- 债指分组绘制（v5.17，用户 2026-10-22 拍板：两组分段、组内名次连续、全量不截断） ---- */
  function _drawIdxGrouped(){
    /* v5.23 久期三档（docs/17 §15）；旧 data.js 无 idx_tier → 回退来源池两组 */
    const _ht = funds.some(f => f.idx_tier);
    const _keys = _ht ? ['dur_s', 'dur_m', 'dur_l'] : ['short_bond', 'long_bond'];
    const _gf = f => _ht ? f.idx_tier : f.idx_group;
    const segs = _keys
      .map(g => ({title: catLabel(g) + '债指 · '
                    + funds.filter(f => _gf(f) === g).length + ' 只',
                  list: funds.filter(f => _gf(f) === g)
                        .sort((a, b) => (a.rank || 0) - (b.rank || 0))}))
      .filter(s => s.list.length);
    const titleH = wide ? 34 : 44, bandGap = wide ? 8 : 10;
    const avail = rowsBot - rowsTop;
    const nTotal = funds.length;
    const nMax = Math.max.apply(null, segs.map(s => s.list.length).concat([1]));
    const rowH = wide
      ? (() => {
          /* 列结构须与下方 wide 分支一致：>2 分段时第 1 段独列、其余纵向堆叠。
             按"各列所需行高"取最小值——堆叠列 = 组头×2 + 段间距10 + 行数和，
             旧算法只按单段最大行数算，堆叠列会超出 rowsBot 压到页脚
             （2026-11-09 用户报公众号宽图右下角重叠）。 */
          const hH = titleH + bandGap, gapS = 10;
          const cols = segs.length > 2
            ? [segs.slice(0, 1), segs.slice(1)]
            : segs.map(s => [s]);
          return Math.max(30, Math.min.apply(null, cols.map(c =>
            Math.floor((avail - c.length * hH - (c.length - 1) * gapS)
                       / Math.max(c.reduce((a, s) => a + s.list.length, 0), 1)))));
        })()
      : Math.floor((avail - segs.length * (titleH + bandGap)) / Math.max(nTotal, 1));
    function seg(s, x0, w, yTop){
