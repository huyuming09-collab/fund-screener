      ctx.fillStyle = '#eef3fd'; rr(x0, yTop, w, titleH, 10); ctx.fill();
      ctx.fillStyle = '#3b6fd4'; rr(x0, yTop, 5, titleH, 3); ctx.fill();
      ctx.fillStyle = '#1d3f7a'; ctx.font = '700 ' + (wide ? 15 : 17) + 'px sans-serif';
      ctx.fillText(s.title, x0 + 15, yTop + Math.round(titleH * 0.66));
      const top = yTop + titleH + bandGap;
      const n = s.list.length;
      const h = Math.max(38, rowH - 6);
      const fName = Math.min(wide ? 22 : 26, Math.round(h * 0.42));
      const fData = Math.max(13, Math.min(wide ? 13 : 15, Math.round(h * 0.25)));
      const fScore = Math.min(wide ? 24 : 30, Math.round(h * 0.52));
      const cardH = Math.max(h + 8, n * rowH - 6);
      const nameX = x0 + 16 + (wide ? 30 : 36) + 12;
      const xScore = x0 + w - 16;
      ctx.fillStyle = '#ffffff'; rr(x0, top, w, cardH, 16); ctx.fill();
      s.list.forEach((f, i) => {
        const ry = top + i * rowH;
        const y = ry + Math.round((rowH - h) / 2);
        if (i < n - 1) {
          ctx.fillStyle = '#f3efe8'; ctx.fillRect(x0 + 40, ry + rowH - 1, w - 56, 1);
        }
        const rk = (f.rank || i + 1);
        const bSize = Math.min(wide ? 30 : 36, h - 12), bx = x0 + 16;
        const by = ry + Math.round((rowH - bSize) / 2);
        ctx.fillStyle = rk === 1 ? '#ffe3e3' : rk === 2 ? '#fff0dd' : rk === 3 ? '#fdf6d8' : '#f4f1ec';
        rr(bx, by, bSize, bSize, 9); ctx.fill();
        ctx.fillStyle = rk === 1 ? '#d32f2f' : rk === 2 ? '#e07b00' : rk === 3 ? '#b08900' : '#8a8175';
        ctx.font = '700 ' + Math.round(bSize * 0.52) + 'px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(String(rk), bx + bSize / 2, by + Math.round(bSize * 0.68)); ctx.textAlign = 'left';
        const l1 = y + Math.round(h * 0.36);
        const scoreW = 78, gapCode = 10;
        ctx.font = (wide ? 12 : 14) + 'px sans-serif';
        const cw = ctx.measureText(f.code || '').width;
        ctx.font = '600 ' + fName + 'px sans-serif';
        const nameAvail = xScore - scoreW - gapCode - cw - 20 - nameX;
        ctx.fillStyle = '#26231e';
        ctx.fillText(_fitText(ctx, f.name || '', nameAvail), nameX, l1);
        if (f.code) {
          const nw = ctx.measureText(_fitText(ctx, f.name || '', nameAvail)).width;
          ctx.fillStyle = '#a8a094'; ctx.font = (wide ? 12 : 14) + 'px sans-serif';
          ctx.fillText(f.code, nameX + nw + gapCode, l1);
        }
        const score = f.score == null ? '—' : (+f.score).toFixed(1);
        ctx.fillStyle = '#ff6a00'; ctx.font = '700 ' + fScore + 'px sans-serif';
        right(score, xScore, y + Math.round(h * 0.40));
        /* 数据行：债指口径不画夏普（评估卡无夏普项）；宽图列窄用短标签 */
        const l2 = y + Math.round(h * 0.86);
        const m = (f.metrics || {});
        const pct = v => v == null ? '—' : (v * 100).toFixed(2) + '%';
        let x = nameX;
        const seg2 = (lb, val, color, fnt) => {
          ctx.font = (fnt || fData) + 'px sans-serif';
          ctx.fillStyle = '#a8a094'; ctx.fillText(lb, x, l2);
          x += ctx.measureText(lb).width + 5;
          ctx.fillStyle = color; ctx.fillText(val, x, l2);
          x += ctx.measureText(val).width + 14;
        };
        seg2(wide ? '近1年 ' : '近一年收益 ', pct(m.ret_1y), '#e53935');
        seg2('·', '', '#ddd'); x += wide ? 4 : 12;
        seg2(wide ? '近5年 ' : '近五年年化 ', pct(m.ret_5y), '#e53935');
        seg2('·', '', '#ddd'); x += wide ? 4 : 12;
        seg2(wide ? '回撤 ' : '近五年最大回撤 ', pct(m.mdd_5y), '#17803d');
      });
      return top + cardH;
    }
    if (wide) {
      /* 2026-11-09 用户定：保持两列——第1列=第1档；其余档（中债+长债，量少）纵向堆进第2列 */
      const gap = 20, colW = Math.floor((W - PAD * 2 - gap) / 2);
      if (segs.length <= 2) {
        segs.forEach((s, i) => seg(s, PAD + i * (colW + gap), colW, rowsTop));
      } else {
        seg(segs[0], PAD, colW, rowsTop);
        let y2 = rowsTop;
        segs.slice(1).forEach(s => { y2 = seg(s, PAD + colW + gap, colW, y2) + 10; });
      }
    } else {
      let y = rowsTop;
      segs.forEach(s => { y = seg(s, PAD, W - PAD * 2, y) + 10; });
    }
    _paintFooter();
    return {width: W, height: H, rows: nTotal, rowH: rowH};
  }

  // ---- 背景：暖米色 ----
  ctx.fillStyle = '#faf7f2'; ctx.fillRect(0, 0, W, H);

  // ---- 顶部标题区：橙色竖条 + 「xx排名」+ 右侧日期胶囊 + 分隔线 ----
  const rowsTop = wide ? 164 : 166;
  const barH = wide ? 42 : 46;
  ctx.fillStyle = '#ff6a00'; rr(PAD, (wide ? 34 : 38), 10, barH, 5); ctx.fill();
  ctx.fillStyle = '#26231e'; ctx.font = '700 ' + (wide ? 40 : 46) + 'px sans-serif';
  ctx.fillText(label + '心动榜', PAD + 24, wide ? 74 : 82);
  const pillTxt = '数据基准 ' + ((D && D.asof) || '—');
  ctx.font = (wide ? 18 : 20) + 'px sans-serif';

  const px = W - PAD - pw, py = (wide ? 36 : 40);
  ctx.fillStyle = '#ffe9d9'; rr(px, py, pw, ph, ph / 2); ctx.fill();
  ctx.fillStyle = '#b3541e';
  ctx.fillText(pillTxt, px + 18, py + ph * 0.68);
  ctx.fillStyle = '#efe7dc'; ctx.fillRect(PAD, rowsTop - 20, W - PAD * 2, 2);
  ctx.fillStyle = '#8a8378'; ctx.font = (wide ? 16 : 18) + 'px sans-serif';
  ctx.fillText('本榜为【' + label + '】池内相对心动值，不同池不可比', PAD, rowsTop - 44);

  // ---- 榜单白卡：双层行体（主角行 + 数据行），标签内联故无列头 ----
  const FOOT = Math.round(H * (wide ? 0.21 : 0.14));
  const rowsBot = H - FOOT - 8;
  if (pool === 'index') return _drawIdxGrouped();   /* v5.17 债指分组绘制（两组分段·全量不截断） */
  const rowH = funds.length ? Math.floor((rowsBot - rowsTop) / funds.length) : rowsBot - rowsTop;
  const h = Math.max(38, rowH - 6);
  const fName = Math.min(wide ? 22 : 26, Math.round(h * 0.42));   // 主角行：基金名
  const fData = Math.max(13, Math.min(wide ? 13 : 15, Math.round(h * 0.25)));  // 数据行
  const fScore = Math.min(wide ? 24 : 30, Math.round(h * 0.52));
  const cardH = Math.max(h + 8, funds.length * rowH - 6);
  const nameX = PAD + 16 + (wide ? 30 : 36) + 12;
  const xScore = W - PAD - 16;
  ctx.fillStyle = '#ffffff'; rr(PAD, rowsTop, W - PAD * 2, cardH, 16); ctx.fill();

  funds.forEach((f, i) => {
    const ry = rowsTop + i * rowH;
    const y = ry + Math.round((rowH - h) / 2);
    if (i < funds.length - 1) {
      ctx.fillStyle = '#f3efe8'; ctx.fillRect(PAD + 40, ry + rowH - 1, W - PAD * 2 - 56, 1);
    }
    const rk = (f.rank || i + 1);
    // 名次徽标
    const bSize = Math.min(wide ? 30 : 36, h - 12), bx = PAD + 16, by = ry + Math.round((rowH - bSize) / 2);
    ctx.fillStyle = rk === 1 ? '#ffe3e3' : rk === 2 ? '#fff0dd' : rk === 3 ? '#fdf6d8' : '#f4f1ec';
    rr(bx, by, bSize, bSize, 9); ctx.fill();
    ctx.fillStyle = rk === 1 ? '#d32f2f' : rk === 2 ? '#e07b00' : rk === 3 ? '#b08900' : '#8a8175';
    ctx.font = '700 ' + Math.round(bSize * 0.52) + 'px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(String(rk), bx + bSize / 2, by + Math.round(bSize * 0.68)); ctx.textAlign = 'left';
    // 主角行：基金名（大）+ 代码（灰）…… 评分（橙大字右端）
    const l1 = y + Math.round(h * 0.36);
    const scoreW = 78, gapCode = 10;
    ctx.fillStyle = '#26231e'; ctx.font = '600 ' + fName + 'px sans-serif';
    const codeW = f.code ? ctx.measureText(' ').width : 0;
    ctx.font = (wide ? 12 : 14) + 'px sans-serif';
    const cw = ctx.measureText(f.code || '').width;
    ctx.font = '600 ' + fName + 'px sans-serif';
    const nameAvail = xScore - scoreW - gapCode - cw - 20 - nameX;   // 硬间隔保证
    ctx.fillText(_fitText(ctx, f.name || '', nameAvail), nameX, l1);
    if (f.code) {
      const nw = ctx.measureText(_fitText(ctx, f.name || '', nameAvail)).width;
      ctx.fillStyle = '#a8a094'; ctx.font = (wide ? 12 : 14) + 'px sans-serif';
      ctx.fillText(f.code, nameX + nw + gapCode, l1);
    }
    const score = f.score == null ? '—' : (+f.score).toFixed(1);
    ctx.fillStyle = '#ff6a00'; ctx.font = '700 ' + fScore + 'px sans-serif';
    right(score, xScore, y + Math.round(h * 0.40));
    // 数据行：内联标签 + 数值（红/红/绿/深灰），小圆点分隔；环比挂右端
    const l2 = y + Math.round(h * 0.86);
    const m = (f.metrics || {});
    const pct = v => v == null ? '—' : (v * 100).toFixed(2) + '%';
    let x = nameX;
    const seg = (labelTxt, valTxt, color, fnt) => {
      ctx.font = (fnt || fData) + 'px sans-serif';
      ctx.fillStyle = '#a8a094'; ctx.fillText(labelTxt, x, l2);
      x += ctx.measureText(labelTxt).width + 5;
      ctx.fillStyle = color; ctx.fillText(valTxt, x, l2);
      x += ctx.measureText(valTxt).width + 14;
    };
    seg('近一年收益 ', pct(m.ret_1y), '#e53935');
    seg('·', '', '#ddd');
    x += 12;
    seg('近五年年化 ', pct(m.ret_5y), '#e53935');
    seg('·', '', '#ddd');
    x += 12;
    seg('近五年最大回撤 ', pct(m.mdd_5y), '#12a150');
    seg('·', '', '#ddd');
    x += 12;
    /* 固收+ 导出图同步卡玛（用户 2026-10-21）；其他池保持夏普 */
    const isFpSeg = f.category === 'fixed_plus';
    seg(isFpSeg ? '卡玛比 ' : '夏普比率 ',
        isFpSeg ? ((m.mdd_5y && m.ret_5y != null) ? (m.ret_5y / m.mdd_5y).toFixed(2) : '—')
                : (m.sharpe_5y == null ? '—' : (+m.sharpe_5y).toFixed(2)), '#44403a');
    const dt = _deltaTxt(f, hasPrev);
    // 指数基金在导出图上标注（名称未必含"指数/ETF"，否则无法与主动基金分辨）
    const tag = f.is_index ? (dt ? '指数·' + dt : '指数') : dt;
    if (tag) {
      ctx.fillStyle = f.is_index ? '#3b6fd4'
        : (f.is_new ? '#ff8a3d' : (f.rank_delta > 0 ? '#e53935' : (f.rank_delta < 0 ? '#12a150' : '#9aa0a6')));
      ctx.font = (wide ? 12 : 13) + 'px sans-serif';
      right(tag, xScore, l2);
    }
  });

  _paintFooter();
  return {width: W, height: H, rows: funds.length, rowH: rowH};
}
function exportDownload(canvas, pool, sizeKey){
  const name = '班马日记本-' + catLabel(pool) + '心动榜-' + ((D && D.asof) || '') + '-' + sizeKey + '.png';
  const done = (url, revoke) => {
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    if (revoke) setTimeout(() => URL.revokeObjectURL(url), 4000);
  };
  if (canvas.toBlob) canvas.toBlob(b => done(URL.createObjectURL(b), true), 'image/png');
  else done(canvas.toDataURL('image/png'), false);
}
function exportPools(){

}

    + '<button class="dl">下载 PNG</button>'
    + (pools.length > 1 ? '<button class="dl-all">下载全部分类</button>' : '')
    + '</div><div class="exp-hint"></div>'
    + '<div class="exp-canvas-box"><div id="mkt-stage"></div><canvas id="exp-canvas"></canvas></div>';
  document.body.appendChild(wrap);
  const cv = document.getElementById('exp-canvas');
  const stage = document.getElementById('mkt-stage');
  const hint = wrap.querySelector('.exp-hint'), title = wrap.querySelector('.t');
  const nameOf = id => (pools.find(p => p.id === id) || {}).name || catLabel(id);
  const draw = () => {
    /* 尺寸按钮按当前图型动态显示（2026-11-05：榜单只 xhs/wide、封面只 cover、其余 xhs/wide） */
    const sb = wrap.querySelector('#size-btns');
    if (sb) {
      sb.innerHTML = tgtSizes().map(s => '<button data-size="' + s + '">' + (SIZE_LABEL[s] || s) + '</button>').join('');
      sb.querySelectorAll('button').forEach(b => b.onclick = () => { sizeKey = b.getAttribute('data-size'); draw(); });
    }
    if (mktNow()) {
      title.textContent = ME.nameOf(pool) + ' · 班马日记本导出';
      hint.textContent = ME.hint(pool, sizeKey) + ' · 数据基准 '
        + ((D.market && D.market.asof) || '') + '（随 data.js 每周日更新，勿用于非本期内容）';
      stage.innerHTML = ME.build(pool, sizeKey, mktKey);
      stage.style.display = ''; cv.style.display = 'none';
      /* 预览自适应（2026-11-05 修：固定像素舞台在手机上显示不全；bare 出图必须
         zoom=1 保持 1:1 像素；非 bare 用白框【内容宽】——clientWidth 含内边距，
         用它算会让米白舞台右溢出圆角白框） */
      const box = stage.parentElement, bcs = getComputedStyle(box);
      const bw = box.clientWidth - parseFloat(bcs.paddingLeft || 0) - parseFloat(bcs.paddingRight || 0);
      stage.style.zoom = bare ? 1 : (bw / ME.sizes[sizeKey].w);
    } else {
      const info = drawExport(cv, pool, sizeKey, rows);
      title.textContent = (pool === 'div_weather' ? '红利天气' : nameOf(pool) + '心动榜')
        + ' · 班马日记本导出'
        + (pools.length > 1 ? '（共 ' + pools.length + ' 个分类，页签切换）' : '');
      hint.textContent = (pool === 'div_weather'
        ? EXPORT_SIZES[sizeKey].label.replace(/TOP\d+/, '红利天气·股息率口径')
        : pool === 'index'
        ? EXPORT_SIZES[sizeKey].label.replace(/TOP\d+/, '全量分组')   /* v5.17 债指不分 TOP 截断 */
        : EXPORT_SIZES[sizeKey].label) + ' · ' + info.rows + ' 行 · 数据基准 '
        + ((D && D.asof) || '') + '（数字取自当期 data.js，勿用于非本期内容）'
        + (pools.length > 1 ? '；「下载全部」逐池出图，浏览器可能询问是否允许多文件下载' : '');
      stage.style.display = 'none'; cv.style.display = '';
    }
    wrap.querySelectorAll('button[data-size]').forEach(b =>
      b.classList.toggle('on', b.getAttribute('data-size') === sizeKey));
    wrap.querySelectorAll('button[data-pool]').forEach(b =>
      b.classList.toggle('on', b.getAttribute('data-pool') === pool));
  };
  wrap.querySelectorAll('button[data-pool]').forEach(b => b.onclick = () => {
    pool = b.getAttribute('data-pool');
    if (tgtSizes().indexOf(sizeKey) < 0) sizeKey = tgtSizes()[0];
    draw();
  });
  window.addEventListener('resize', () => { if (mktNow()) draw(); });
  wrap.querySelector('.dl').onclick = () => { if (!mktNow()) exportDownload(cv, pool, sizeKey); };
  const dlAll = wrap.querySelector('.dl-all');
  if (dlAll) dlAll.onclick = () => {
    if (mktNow()) return;
    const list = pools.map(p => p.id), step = i => {
      if (i >= list.length) { draw(); return; }
      drawExport(cv, list[i], sizeKey, rows);
      setTimeout(() => { exportDownload(cv, list[i], sizeKey); step(i + 1); }, 600);
    };
    step(0);
  };
  draw();
  return true;
}

/* ============ 启动 ============ */
/* 免责声明：优先取 data.js，缺失时用与 cards.DISCLAIMER 同口径的静态兜底 */
const DISCLAIMER_FALLBACK = '本页数据由程序基于公开历史数据自动生成，仅为数据分析研究结论，'
  + '不构成任何投资建议或基金推介；数据来自公开渠道，可能存在延迟与错误；'
  + '心动值仅供参考，靠前只代表在当前口径下占优，并不预示后续表现一定更好；'
  + '历史业绩与心动值不代表未来表现，基金有风险，投资须谨慎，据此操作风险自担。';
$('p-disc').textContent = (D && D.disclaimer) || DISCLAIMER_FALLBACK;
/* v1.5 免责常显：不再折叠、无需点击（toggleDisc 已移除） */
/* v1.4：列表下滚时顶栏收起 meta 行（问题6「上下部分显示逻辑」），上滚恢复 */
(function(){
  const sc = document.getElementById('list');
  sc.addEventListener('scroll', () => {
    document.getElementById('hdr').classList.toggle('compact', sc.scrollTop > 48);
  }, {passive: true});
})();
if (initExport()){
  /* 隐藏导出模式：海报已渲染，跳过常规榜单渲染 */
} else if(!D || !D.funds){
  document.getElementById('list').innerHTML =
    '<div class="empty-tip">数据未加载：请先运行 <b>python -m fundscorer.pipeline</b> 生成 data.js</div>';
}else{
  /* v1.8 进入网址默认到主界面（用户 2026-10-31）：无 section/cat/group 参数时跳 home.html。
     smoke 测试无 location（typeof undefined）→ 不跳，正常渲染。 */
  let _hasParam = false;
  try { _hasParam = !!(location.search && /section=|cat=|group=|eqdetail=/.test(location.search)); } catch(e){}
  if (!_hasParam && typeof location !== 'undefined' && location.replace){
    location.replace('home.html');
  } else {
  /* v1.7 先定内容区（?section=），再渲染该区首个启用页签；旧 ?cat=/?group= 兼容映射到区 */
  (function(){
    try{
      const q = new URLSearchParams(location.search);
      let sec = q.get('section');
      const cat = q.get('cat'), grp = q.get('group');
      if (!sec){
        if (cat) sec = sectionOfCat(cat);
        else if (grp) sec = (grp === 'index') ? 'index' : 'bond';
      }
      if (sec && SECTIONS[sec]) SECTION = sec;
    }catch(e){/* 忽略：解析失败停默认偏债区 */}
  })();
  /* 选中本区首个启用页签（?cat= 若在本区内则优先） */
  (function(){
    const inSec = (D.categories||[]).filter(c => SECTIONS[SECTION].tabs.includes(c.id) && c.enabled);
    let want = null;
    try{
      const q = new URLSearchParams(location.search);
      const cat = q.get('cat');
      if (cat && inSec.some(c => c.id === cat)) want = cat;
    }catch(e){}
    ACTIVE = want || (inSec[0] && inSec[0].id) || D.category || 'short_bond';
    renderTabs(ACTIVE); renderList(); renderPick();
  })();
  /* 红利天气深链（2026-11-06）：?eqdetail=CODE → 打开该指数详情（配合 weather.html 卡片墙） */
  (function(){
    try{
      const c = new URLSearchParams(location.search).get('eqdetail');
      if (c){ EQ_WX_BACK = true; openEqIndexDetail(c); }
    }catch(e){}
  })();
  }
}
</script>
</body>
</html>
